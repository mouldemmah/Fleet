  <style>
    /* ==========================================================================
       1. متغيرات الألوان والأساس الثابت بدون أي تمرير عمودي (ZERO VERTICAL SCROLL)
       ========================================================================== */
    :root {
      --bg-app: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --border-card: #e2e8f0;
      --navy-start: #0f2942;
      --navy-end: #163a5f;
      --cyan: #0284c7;
      --cyan-bright: #0ea5e9;
      --cyan-soft: #e0f2fe;
      --emerald: #059669;
      --emerald-soft: #d1fae5;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --red: #dc2626;
      --red-soft: #fee2e2;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --shadow-card: 0 2px 8px rgba(15, 41, 66, 0.06);
      --shadow-hero: 0 8px 18px -6px rgba(15, 41, 66, 0.34);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #cbd5e1;
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.35;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    /* ==========================================================================
       2. الهيكل الثابت للتطبيق (100dvh - لا يوجد تمرير عمودي نهائياً)
       ========================================================================== */
    .app-shell {
      height: 100dvh;
      max-height: 100dvh;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      background-color: var(--bg-app);
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 36px rgba(15, 23, 42, 0.18);
    }

    @media (min-width: 561px) {
      body {
        padding: 8px 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-shell {
        height: calc(100dvh - 16px);
        max-height: calc(100dvh - 16px);
        border-radius: 22px;
        border: 1px solid #94a3b8;
      }
    }

    /* الشريط العلوي المضغوط (48px - يناسب عرض 360px بدون التفاف) */
    .app-header {
      height: 48px;
      min-height: 48px;
      background: linear-gradient(135deg, var(--navy-start) 0%, var(--navy-end) 100%);
      color: #ffffff;
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 5px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(15, 41, 66, 0.22);
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 5px;
      min-width: 0;
      flex: 1;
    }

    .header-logo {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-ship-select {
      background-color: rgba(14, 165, 233, 0.22);
      border: 1px solid rgba(56, 189, 248, 0.48);
      color: #e0f2fe;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
      flex: 1;
      min-width: 72px;
      max-width: 126px;
      text-overflow: ellipsis;
    }
    .header-ship-select option {
      background-color: var(--navy-start);
      color: #ffffff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }

    .hdr-quick-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #ffffff;
      border-radius: 999px;
      padding: 5px 8px;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .hdr-quick-btn.btn-install-pill {
      background: rgba(245, 158, 11, 0.25);
      border-color: rgba(251, 191, 36, 0.55);
      color: #fef3c7;
    }
    .hdr-quick-btn:active { transform: scale(0.95); }

    /* مؤشر المزامنة في الشريط العلوي */
    .sync-badge-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 7px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid transparent;
      max-width: 96px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sync-badge-btn:active { transform: scale(0.95); }
    .sync-badge-btn.badge-green {
      background: rgba(5, 150, 105, 0.28);
      border-color: rgba(52, 211, 153, 0.52);
      color: #d1fae5;
    }
    .sync-badge-btn.badge-amber {
      background: rgba(217, 119, 6, 0.28);
      border-color: rgba(251, 191, 36, 0.55);
      color: #fef3c7;
    }
    .sync-badge-btn.badge-gray {
      background: rgba(148, 163, 184, 0.24);
      border-color: rgba(203, 213, 225, 0.45);
      color: #e2e8f0;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .badge-green .status-dot { background-color: #34d399; }
    .badge-amber .status-dot {
      background-color: #fbbf24;
      animation: pulseDot 1.1s infinite ease-in-out;
    }
    .badge-gray .status-dot { background-color: #94a3b8; }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.65; }
    }

    /* الحاوية الوسطى الثابتة بدون أي تمرير عمودي */
    .app-main {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
      padding: 8px;
    }

    .tab-view {
      display: none;
    }
    .tab-view.active {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      gap: 6px;
    }

    /* الشريط السفلي الثابت (60px - 7 تبويبات) */
    .bottom-nav {
      height: 60px;
      min-height: 60px;
      background-color: #ffffff;
      border-top: 1px solid var(--border-card);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 4px 3px calc(4px + env(safe-area-inset-bottom, 0px));
      gap: 2px;
      flex-shrink: 0;
      box-shadow: 0 -3px 12px rgba(15, 41, 66, 0.08);
      z-index: 25;
    }

    .nav-tab-btn {
      background: transparent;
      border: none;
      border-radius: 10px;
      padding: 3px 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      color: var(--text-muted);
      position: relative;
      transition: background-color 0.14s, transform 0.1s;
    }
    .nav-tab-btn:active { transform: scale(0.94); }
    .nav-tab-btn.active {
      background-color: var(--cyan-soft);
      color: var(--navy-start);
    }
    .nav-tab-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background-color: var(--cyan);
    }

    .nav-icon-wrap {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-label {
      font-size: 9.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .nav-tab-btn.active .nav-label {
      font-weight: 900;
      color: var(--navy-start);
    }

    /* ==========================================================================
       3. البطاقات والشبكات والجداول المضغوطة والترقيم
       ========================================================================== */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 8px 10px;
      box-shadow: var(--shadow-card);
    }

    .flex-fill-card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .hero-card {
      background: linear-gradient(135deg, var(--navy-start) 0%, var(--navy-end) 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 9px 11px;
      box-shadow: var(--shadow-hero);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      left: -24px;
      top: -24px;
      width: 92px;
      height: 92px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.14);
      pointer-events: none;
    }

    .hero-label { font-size: 10.5px; font-weight: 700; color: #bae6fd; }
    .hero-value { font-size: 20px; font-weight: 900; line-height: 1.15; }
    .hero-currency { font-size: 11px; font-weight: 800; color: #38bdf8; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .kpi-box {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 6px 9px;
      box-shadow: var(--shadow-card);
    }
    .kpi-title { font-size: 10px; font-weight: 700; color: var(--text-muted); }
    .kpi-num { font-size: 14px; font-weight: 900; margin-top: 1px; color: var(--text-main); }
    .kpi-sub { font-size: 9.5px; font-weight: 700; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .text-cyan { color: var(--cyan); }
    .text-emerald { color: var(--emerald); }
    .text-amber { color: var(--amber); }
    .text-red { color: var(--red); }
    .text-navy { color: var(--navy-start); }
    .text-muted { color: var(--text-muted); }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }
    .sec-title { font-size: 12.5px; font-weight: 900; color: var(--navy-start); }
    .sec-subtitle { font-size: 10px; color: var(--text-muted); font-weight: 600; }

    /* عناصر الإدخال */
    .input-field {
      width: 100%;
      background-color: var(--bg-subtle);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
    }
    .input-field:focus {
      background-color: #ffffff;
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.18);
    }

    .input-compact {
      padding: 5px 3px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    .matrix-input {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 2px;
      text-align: center;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-main);
      outline: none;
    }
    .matrix-input:focus {
      background: #ffffff;
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.2);
    }

    .field-label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    /* الأزرار */
    .btn {
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      transition: transform 0.1s, opacity 0.14s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-xs { padding: 4px 7px; font-size: 10.5px; border-radius: 7px; }
    .btn-sm { padding: 5px 9px; font-size: 11px; border-radius: 8px; }
    .btn-block { width: 100%; }

    .btn-navy { background: var(--navy-start); color: #ffffff; }
    .btn-cyan { background: var(--cyan); color: #ffffff; }
    .btn-emerald { background: var(--emerald); color: #ffffff; }
    .btn-amber { background: var(--amber-soft); color: #92400e; border: 1px solid #fcd34d; }
    .btn-red { background: var(--red-soft); color: var(--red); border: 1px solid #fecaca; }
    .btn-ghost { background: #f1f5f9; color: var(--text-main); border: 1px solid #cbd5e1; }
    .btn-light-alpha { background: rgba(255,255,255,0.16); color: #ffffff; border: 1px solid rgba(255,255,255,0.28); }

    /* التبويبات الفرعية والأزرار الاختيارية */
    .subtab-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .subtab-bar.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }
    .subtab-btn {
      border: none;
      background: transparent;
      color: #475569;
      border-radius: 7px;
      padding: 6px 4px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: #ffffff;
      color: var(--navy-start);
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .sel-pill {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: var(--text-main);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .sel-pill.active {
      background: var(--navy-start);
      color: #ffffff;
      border-color: var(--cyan-bright);
    }

    /* شارات العينات والتصنيفات */
    .grade-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .grade-F  { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .grade-R  { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    .grade-P  { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .grade-RR { background: #ede9fe; color: #5b21b6; border: 1px solid #ddd6fe; }

    .cat-badge {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .cat-fuel  { background: var(--red-soft); color: var(--red); }
    .cat-food  { background: var(--amber-soft); color: #92400e; }
    .cat-ice   { background: var(--cyan-soft); color: #0369a1; }
    .cat-maint { background: #ede9fe; color: #5b21b6; }
    .cat-fees  { background: #fce7f3; color: #9d174d; }
    .cat-pers  { background: #dcfce7; color: #166534; }
    .cat-other { background: #e2e8f0; color: #334155; }

    /* شريط الترقيم السريع (Pagination) */
    .pager-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid #f1f5f9;
      flex-shrink: 0;
    }
    .pager-info {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--text-muted);
    }

    /* الجداول */
    .table-wrap {
      overflow-x: auto;
      overflow-y: hidden;
      flex: 1;
      min-height: 0;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      text-align: right;
    }
    table.data-table th {
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      font-weight: 800;
      padding: 5px 4px;
      border-bottom: 1px solid var(--border-card);
      font-size: 10px;
      white-space: nowrap;
    }
    table.data-table td {
      padding: 6px 4px;
      border-bottom: 1px solid #f1f5f9;
      font-weight: 700;
    }
    table.data-table tr.clickable-row { cursor: pointer; }
    table.data-table tr.active-row { background-color: var(--cyan-soft); }

    /* مصفوفة الإنتاج (صف السفينة + 6 بحارة بدون تمرير) */
    table.matrix-table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.matrix-table th {
      background: #f8fafc;
      padding: 5px 2px;
      font-size: 10px;
      font-weight: 900;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
    }
    table.matrix-table td {
      padding: 3px 2px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    table.matrix-table tr.vessel-own-row {
      background: #f0f9ff;
    }

    /* شبكة البحارة 2×3 */
    .sailors-grid-2x3 {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      overflow: hidden;
    }
    .sailor-card-btn {
      background: #ffffff;
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 6px 8px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: right;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.14s, transform 0.1s;
    }
    .sailor-card-btn:active {
      transform: scale(0.97);
      border-color: var(--cyan);
    }

    /* شبكة الأسعار (4 بطاقات متساوية) */
    .pricing-grid-4 {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      overflow: hidden;
    }

    /* مساعدات التخطيط */
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .stack-xs > * + * { margin-top: 5px; }
    .stack-sm > * + * { margin-top: 7px; }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      color: var(--navy-start);
    }
    .toggle-pill input {
      accent-color: var(--cyan);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    /* القوائم المرقمة */
    .paged-items-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow: hidden;
    }

    .list-row-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    /* معاينة أيقونة PWA */
    .pwa-preview-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #f0f9ff 0%, #f8fafc 100%);
      border: 1px solid #bae6fd;
      border-radius: 12px;
      padding: 8px 10px;
    }
    .pwa-icon-img {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      box-shadow: 0 4px 10px rgba(15, 41, 66, 0.25);
      flex-shrink: 0;
      background: #0f2942;
      object-fit: cover;
    }

    /* ==========================================================================
       4. النوافذ المنبثقة (بدون تمرير عمودي وبدون علامة إغلاق)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(2px);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 495px;
      max-height: 92dvh;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 22px 44px -10px rgba(0, 0, 0, 0.35);
    }

    .modal-head {
      padding: 10px 12px;
      background: linear-gradient(135deg, var(--navy-start), var(--navy-end));
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .modal-head h3 {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-body {
      padding: 10px 12px;
      overflow: hidden;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    /* الإشعارات العلوية (Toast) */
    .toast-box {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 440px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
    }
    .toast-item {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast-success { background: var(--emerald); }
    .toast-error   { background: var(--red); }
    .toast-info    { background: var(--navy-start); }

    /* ورقة الطباعة الكاملة المخفية */
    #print-only-sheet {
      display: none;
    }

    @media print {
      html, body {
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
        background: #ffffff !important;
      }
      body > * {
        display: none !important;
      }
      #print-only-sheet {
        display: block !important;
        width: 100% !important;
        padding: 14px !important;
        color: #0f172a !important;
        background: #ffffff !important;
      }
    }
  </style>
</head>
<body>

  <!-- حاوية الإشعارات -->
  <div id="toast-container" class="toast-box"></div>

  <!-- الهيكل الثابت للتطبيق -->
  <div class="app-shell">

    <!-- ==================== الشريط العلوي الثابت (48px) ==================== -->
    <header class="app-header">
      <div class="header-left">
        <div class="header-logo" aria-hidden="true">
          <svg width="19" height="19" viewBox="0 0 32 32" fill="none">
            <path d="M5 20L8 26H24L27 20H5Z" fill="#f59e0b"></path>
            <path d="M9 12H23L25 20H7L9 12Z" fill="#ffffff"></path>
            <rect x="13" y="7" width="6" height="5" rx="1" fill="#38bdf8"></rect>
            <path d="M3 27C6 25 9 29 12 27C15 25 18 29 21 27C24 25 27 29 29 27" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </div>
        <select id="hdr-ship-select" class="header-ship-select" aria-label="اختيار السفينة النشطة" onchange="selectBoat(this.value)"><option value="ship-ahmad-hamad" selected="">البركة 1 (احمد)</option><option value="ship-omar">البركة 2 (عمر)</option><option value="ship-ahmad-salek">البركة 3 (عبدالله)</option><option value="ship-1795554236205">البركة 4 (احمد سالك)</option></select>
      </div>

      <div class="header-actions">
        <button type="button" class="hdr-quick-btn" onclick="openSettlementModal('summary')">تصفية</button>
        <button type="button" class="hdr-quick-btn btn-install-pill" onclick="openSyncModal('install')">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12"></path>

          <span class="status-dot"></span>
          <span id="hdr-sync-text">حفظ محلي</span>
        </button>
      </div>
    </header>

    <!-- ==================== منطقة العرض الوسطى (صفر تمرير عمودي) ==================== -->
    <main class="app-main">
      <section id="view-home" class="tab-view active"></section>
      <section id="view-production" class="tab-view"></section>
      <section id="view-sailors" class="tab-view"></section>
      <section id="view-purchases" class="tab-view"></section>
      <section id="view-manager" class="tab-view"></section>
      <section id="view-pricing" class="tab-view"></section>
      <section id="view-boats" class="tab-view"></section>
    </main>

    <!-- ==================== الشريط السفلي الثابت (60px - 7 تبويبات) ==================== -->
    <nav class="bottom-nav" aria-label="التنقل الرئيسي">

      <!-- 1. الرئيسية -->
      <button type="button" class="nav-tab-btn active" data-tab="home" onclick="switchTab('home')">
        <span class="nav-icon-wrap">
          <svg width="23" height="23" viewBox="0 0 32 32" fill="none">
            <rect x="2" y="2" width="28" height="28" rx="7" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"></rect>
            <rect x="7" y="15" width="4.5" height="10" rx="1.2" fill="#059669"></rect>
            <rect x="13.75" y="10" width="4.5" height="15" rx="1.2" fill="#d97706"></rect>
            <rect x="20.5" y="7" width="4.5" height="18" rx="1.2" fill="#0284c7"></rect>
          </svg>
        </span>
        <span class="nav-label">الرئيسية</span>
      </button>

      <!-- 2. الإنتاج -->
      <button type="button" class="nav-tab-btn" data-tab="production" onclick="switchTab('production')">

      function drawShipIconCanvas(size) {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const s = size / 512;

        // خلفية كحلية بحرية متدرجة بزوايا دائرية
        const bgGrad = ctx.createLinearGradient(0, 0, size, size);
        bgGrad.addColorStop(0, '#0f2942');
        bgGrad.addColorStop(1, '#163a5f');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, size, size);

        // هالة سماوية خفيفة في الخلفية
        const glow = ctx.createRadialGradient(256 * s, 210 * s, 20 * s, 256 * s, 220 * s, 220 * s);
        glow.addColorStop(0, 'rgba(56, 189, 248, 0.28)');
        glow.addColorStop(1, 'rgba(56, 189, 248, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, size, size);

        // هلال / شمس ذهبية ناعمة خلف السفينة
        ctx.beginPath();
        ctx.arc(365 * s, 128 * s, 44 * s, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(245, 158, 11, 0.92)';
        ctx.fill();

        // المدخنة العلوية
        ctx.fillStyle = '#f59e0b';
        ctx.fillRect(226 * s, 108 * s, 60 * s, 54 * s);
        ctx.fillStyle = '#0ea5e9';
        ctx.fillRect(226 * s, 122 * s, 60 * s, 14 * s);

        // كابينة القيادة البيضاء
        ctx.beginPath();
        ctx.moveTo(156 * s, 162 * s);
        ctx.lineTo(356 * s, 162 * s);
        ctx.lineTo(380 * s, 260 * s);
        ctx.lineTo(132 * s, 260 * s);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        // نوافذ الكابينة السماوية
        ctx.fillStyle = '#0284c7';
        const winY = 190 * s;
        const winW = 46 * s;
        const winH = 34 * s;
        [168, 233, 298].forEach(wx => {
          ctx.beginPath();
          if (ctx.roundRect) {
            ctx.roundRect(wx * s, winY, winW, winH, 7 * s);
          } else {
            ctx.rect(wx * s, winY, winW, winH);
          }
          ctx.fill();
        });

        // هيكل السفينة السفلي بالذهبي البحري والكحلي
        ctx.beginPath();
        ctx.moveTo(86 * s, 260 * s);
        ctx.lineTo(426 * s, 260 * s);
        ctx.lineTo(382 * s, 356 * s);
        ctx.lineTo(130 * s, 356 * s);
        ctx.closePath();
        const hullGrad = ctx.createLinearGradient(86 * s, 260 * s, 426 * s, 356 * s);
        hullGrad.addColorStop(0, '#f59e0b');
        hullGrad.addColorStop(1, '#d97706');
        ctx.fillStyle = hullGrad;
        ctx.fill();

        // خط أبيض فاصل على الهيكل
        ctx.fillStyle = '#e0f2fe';
        ctx.fillRect(102 * s, 276 * s, 308 * s, 12 * s);

        // الأمواج السماوية أسفل السفينة
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        ctx.beginPath();
        ctx.moveTo(52 * s, 378 * s);
        ctx.quadraticCurveTo(104 * s, 344 * s, 154 * s, 378 * s);
        ctx.quadraticCurveTo(204 * s, 412 * s, 256 * s, 378 * s);
        ctx.quadraticCurveTo(308 * s, 344 * s, 358 * s, 378 * s);
        ctx.quadraticCurveTo(408 * s, 412 * s, 460 * s, 378 * s);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 22 * s;
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(76 * s, 426 * s);
        ctx.quadraticCurveTo(136 * s, 398 * s, 196 * s, 426 * s);
        ctx.quadraticCurveTo(256 * s, 454 * s, 316 * s, 426 * s);
        ctx.quadraticCurveTo(376 * s, 398 * s, 436 * s, 426 * s);
        ctx.strokeStyle = '#0ea5e9';
        ctx.lineWidth = 16 * s;
        ctx.stroke();

        return canvas.toDataURL('image/png');
      }

      function buildServiceWorkerSource() {
        return [
          "const CACHE_NAME = 'fishing-fleet-pwa-v1';",
          "const ASSETS = ['./', './index.html'];",
          "",
          "self.addEventListener('install', function (event) {",
          "  event.waitUntil(",
          "    caches.open(CACHE_NAME)",
          "      .then(function (cache) { return cache.addAll(ASSETS); })",
          "      .then(function () { return self.skipWaiting(); })",
          "  );",
          "});",
          "",
          "self.addEventListener('activate', function (event) {",
          "  event.waitUntil(",
          "    caches.keys().then(function (keys) {",
          "      return Promise.all(keys.filter(function (k) { return k !== CACHE_NAME; }).map(function (k) { return caches.delete(k); }));",
          "    }).then(function () { return self.clients.claim(); })",
          "  );",
          "});",
          "",
          "self.addEventListener('fetch', function (event) {",
          "  if (event.request.method !== 'GET') return;",
          "  event.respondWith(",
          "    caches.match(event.request).then(function (cached) {",
          "      var netFetch = fetch(event.request).then(function (res) {",
          "        if (res && res.status === 200) {",
          "          var copy = res.clone();",
          "          caches.open(CACHE_NAME).then(function (c) { c.put(event.request, copy); });",
          "        }",
          "        return res;",
          "      }).catch(function () { return cached || caches.match('./index.html'); });",
          "      return cached || netFetch;",
          "    })",
          "  );",
          "});"
        ].join('\n');
      }

      function triggerFileDownload(filename, content, mimeType) {
        try {
          const blob = new Blob([content], { type: mimeType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => URL.revokeObjectURL(url), 1200);
          return true;
        } catch (e) {
          return false;
        }
      }

      function normalizeBoat(rawBoat) {
        const defPricing = createDefaultPricing();
        const pricing = {};
        GRADES.forEach(g => {
          const src = rawBoat && rawBoat.pricing && rawBoat.pricing[g] ? rawBoat.pricing[g] : defPricing[g];
          pricing[g] = {
            sellPrice: Math.max(0, Number(src.sellPrice) || 0),
            crewPrice: Math.max(0, Number(src.crewPrice) || 0)
          };
        });

        const boatProd = {};
        GRADES.forEach(g => {
          boatProd[g] = Math.max(0, Number(rawBoat && rawBoat.boatProduction && rawBoat.boatProduction[g]) || 0);
        });

        const rawSailors = Array.isArray(rawBoat && rawBoat.sailors) ? rawBoat.sailors : [];
        const sailors = [];
        for (let i = 0; i < 6; i++) {
          const rs = rawSailors[i] || {};
          const sProd = {};
          GRADES.forEach(g => {
            sProd[g] = Math.max(0, Number(rs.production && rs.production[g]) || 0);
          });
          sailors.push({
            id: i + 1,
            name: String(rs.name || ('بحار ' + (i + 1))),
            production: sProd,
            debt: Math.max(0, Number(rs.debt) || 0),
            autoDeduct: rs.autoDeduct !== false,
            manualDeduction: Math.max(0, Number(rs.manualDeduction) || 0)
          });
        }

        const purchases = Array.isArray(rawBoat && rawBoat.purchases)
          ? rawBoat.purchases.map(p => ({
              id: String(p.id || ('pur-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6))),
              date: String(p.date || getTodayISO()),
              item: String(p.item || 'مصروف'),
              category: PURCHASE_CATEGORIES.includes(p.category) ? p.category : 'أخرى',
              amount: Math.max(0, Number(p.amount) || 0)
            }))
          : [];

        const managerProduction = Array.isArray(rawBoat && rawBoat.managerProduction)
          ? rawBoat.managerProduction.map(mp => ({
              id: String(mp.id || ('mp-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6))),
              date: String(mp.date || getTodayISO()),
              grade: GRADES.includes(mp.grade) ? mp.grade : 'F',
              kg: Math.max(0, Number(mp.kg) || 0),
              unitPrice: Math.max(0, Number(mp.unitPrice) || 0),
              note: String(mp.note || '')
            }))
          : [];

        const managerExpenses = Array.isArray(rawBoat && rawBoat.managerExpenses)
          ? rawBoat.managerExpenses.map(me => {
              const cat = me.category === 'شخصي' ? 'مصروف شخصي' : me.category;
              return {
                id: String(me.id || ('me-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6))),
                date: String(me.date || getTodayISO()),
                item: String(me.item || 'مصروف مسير'),
                category: MGR_EXPENSE_CATEGORIES.includes(cat) ? cat : 'أخرى',
                amount: Math.max(0, Number(me.amount) || 0)
              };
            })
          : [];

        return {
          id: String((rawBoat && rawBoat.id) || ('ship-' + Date.now())),
          name: String((rawBoat && rawBoat.name) || 'سفينة'),
          captain: String((rawBoat && rawBoat.captain) || 'الربان'),
          todayDate: String((rawBoat && rawBoat.todayDate) || getTodayISO()),
          pricing: pricing,
          boatProduction: boatProd,
          sailors: sailors,
          purchases: purchases,
          managerProduction: managerProduction,
          managerExpenses: managerExpenses
        };
      }

      function normalizeState(raw) {
        const def = createDefaultState();
        if (!raw || typeof raw !== 'object' || !Array.isArray(raw.boats) || raw.boats.length === 0) {
          return def;
        }
        const boats = raw.boats.map(normalizeBoat);
        const validTabs = ['home', 'production', 'sailors', 'purchases', 'manager', 'pricing', 'boats'];
        const activeTab = validTabs.includes(raw.activeTab) ? raw.activeTab : 'home';
        const activeBoatId = boats.some(b => b.id === raw.activeBoatId) ? raw.activeBoatId : boats[0].id;

        const sync = Object.assign({}, def.sync, raw.sync || {});
        if (!Array.isArray(sync.logs)) sync.logs = def.sync.logs;
        sync.autoSync = sync.autoSync !== false;

        return {
          version: 5,
          currency: String(raw.currency || 'أوقية'),
          activeTab: activeTab,
          activeBoatId: activeBoatId,
          boats: boats,
          history: Array.isArray(raw.history) ? raw.history : [],
          sync: sync
        };
      }

      function loadState() {
        try {
          let raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            for (let i = 0; i < FALLBACK_KEYS.length; i++) {
              const candidate = localStorage.getItem(FALLBACK_KEYS[i]);
              if (candidate) {
                raw = candidate;
                break;
              }
            }
          }
          if (!raw) return createDefaultState();
          return normalizeState(JSON.parse(raw));
        } catch (e) {
          return createDefaultState();
        }
      }

      function saveToLocalStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {
          showToast('تعذر الحفظ في ذاكرة المتصفح', 'error');
        }
      }

      function pushSyncLog(msg) {
        if (!state.sync) state.sync = { syncUrl: '', autoSync: true, pendingChangesCount: 0, lastSyncedAt: '', logs: [] };
        state.sync.logs.unshift({ time: getTimeStampLabel(), msg: msg });
        if (state.sync.logs.length > 20) state.sync.logs.length = 20;
      }

      function persistState(isDataChange, logMessage) {
        if (isDataChange) {
          state.sync.pendingChangesCount = (state.sync.pendingChangesCount || 0) + 1;
          if (logMessage) pushSyncLog(logMessage);
        }
        saveToLocalStorage();
        updateHeaderSyncBadge();
        if (isDataChange) scheduleAutoSync();
      }

      function fmtMoney(val) {
        const n = Number(val);
        return (Number.isFinite(n) ? Math.round(n) : 0).toLocaleString('en-US');
      }

      function fmtNum(val) {
        const n = Number(val);
        return (Number.isFinite(n) ? n : 0).toLocaleString('en-US', { maximumFractionDigits: 2 });
      }

      function numVal(v) {
        const n = parseFloat(v);
        return Number.isFinite(n) ? n : 0;
      }

      function escHTML(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function getActiveBoat() {
        let boat = state.boats.find(b => b.id === state.activeBoatId);
        if (!boat) {
          boat = state.boats[0];
          state.activeBoatId = boat.id;
        }
        return boat;
      }

      function getCategoryClass(cat) {
        if (cat === 'محروقات') return 'cat-fuel';
        if (cat === 'معاش') return 'cat-food';
        if (cat === 'ثلج') return 'cat-ice';
        if (cat === 'صيانة') return 'cat-maint';
        if (cat === 'رسوم') return 'cat-fees';
        if (cat === 'مصروف شخصي' || cat === 'شخصي') return 'cat-pers';
        return 'cat-other';
      }

      function paginateArray(arr, page, perPage) {
        const total = arr.length;
        const totalPages = Math.max(1, Math.ceil(total / perPage));
        const safePage = Math.min(Math.max(1, page), totalPages);
        const start = (safePage - 1) * perPage;
        return {
          items: arr.slice(start, start + perPage),
          page: safePage,
          totalPages: totalPages,
          total: total
        };
      }

      function renderPagerHTML(page, totalPages, totalItems, prevCall, nextCall) {
        if (totalPages <= 1 && totalItems <= 0) return '';
        return `
          <div class="pager-bar">
            <button type="button" class="btn btn-xs btn-ghost" ${page <= 1 ? 'disabled' : ''} onclick="${prevCall}">السابق</button>
            <span class="pager-info">صفحة <span dir="ltr">${page} / ${totalPages}</span> (<span dir="ltr">${totalItems}</span>)</span>
            <button type="button" class="btn btn-xs btn-ghost" ${page >= totalPages ? 'disabled' : ''} onclick="${nextCall}">التالي</button>
          </div>
        `;
      }

      /* ========================================================================
         5. المحرك الحسابي للأسطول والسفن والبحارة
         ======================================================================== */
      function calcSailorMetrics(sailor, pricing) {
        let kg = 0;
        let salesVal = 0;
        let grossShare = 0;

        GRADES.forEach(g => {
          const qty = Math.max(0, numVal(sailor.production[g]));
          const sellP = Math.max(0, numVal(pricing[g].sellPrice));
          const crewP = Math.max(0, numVal(pricing[g].crewPrice));
          kg += qty;
          salesVal += qty * sellP;
          grossShare += qty * crewP;
        });

        const debt = Math.max(0, numVal(sailor.debt));
        let deduction = 0;
        if (sailor.autoDeduct) {
          deduction = Math.min(debt, grossShare);
        } else {
          const manual = Math.max(0, numVal(sailor.manualDeduction));
          deduction = Math.min(debt, Math.min(grossShare, manual));
        }

        const netPayable = Math.max(0, grossShare - deduction);
        const remainingDebt = Math.max(0, debt - deduction);

        return {
          name: sailor.name,
          kg: kg,
          salesVal: salesVal,
          grossShare: grossShare,
          debt: debt,
          deduction: deduction,
          netPayable: netPayable,
          remainingDebt: remainingDebt
        };
      }

      function calcBoatMetrics(boat) {
        let vesselProdKg = 0;
        let vesselSalesVal = 0;

        GRADES.forEach(g => {
          const qty = Math.max(0, numVal(boat.boatProduction[g]));
          const sellP = Math.max(0, numVal(boat.pricing[g].sellPrice));
          vesselProdKg += qty;
          vesselSalesVal += qty * sellP;
        });

        let sailorsProdKg = 0;
        let sailorsSalesVal = 0;
        let totalSailorsShare = 0;
        let totalDebt = 0;
        let totalDebtDeducted = 0;
        let totalNetPaidToSailors = 0;

        const sailorMetrics = boat.sailors.map(s => {
          const sm = calcSailorMetrics(s, boat.pricing);
          sailorsProdKg += sm.kg;
          sailorsSalesVal += sm.salesVal;
          totalSailorsShare += sm.grossShare;
          totalDebt += sm.debt;
          totalDebtDeducted += sm.deduction;
          totalNetPaidToSailors += sm.netPayable;
          return sm;
        });

        let totalPurchases = 0;
        let fuelTotal = 0;
        let otherExpensesTotal = 0;

        boat.purchases.forEach(p => {
          const amt = Math.max(0, numVal(p.amount));
          totalPurchases += amt;
          if (p.category === 'محروقات') fuelTotal += amt;
          else otherExpensesTotal += amt;
        });

        const totalProductionKg = vesselProdKg + sailorsProdKg;
        const totalSalesValue = vesselSalesVal + sailorsSalesVal;
        const netVesselProfit = totalSalesValue - totalSailorsShare - totalPurchases;

        return {
          vesselProdKg: vesselProdKg,
          vesselSalesVal: vesselSalesVal,
          sailorsProdKg: sailorsProdKg,
          sailorsSalesVal: sailorsSalesVal,
          totalSailorsShare: totalSailorsShare,
          totalDebt: totalDebt,
          totalDebtDeducted: totalDebtDeducted,
          totalNetPaidToSailors: totalNetPaidToSailors,
          totalPurchases: totalPurchases,
          fuelTotal: fuelTotal,
          otherExpensesTotal: otherExpensesTotal,
          totalProductionKg: totalProductionKg,
          totalSalesValue: totalSalesValue,
          netVesselProfit: netVesselProfit,
          sailorMetrics: sailorMetrics
        };
      }

      function calcFleetMetrics() {
        let totalKg = 0;
        let totalSales = 0;
        let totalSailorsShare = 0;
        let totalDebt = 0;
        let totalPurchases = 0;
        let netFleetProfit = 0;

        const perBoat = state.boats.map(b => {
          const m = calcBoatMetrics(b);
          totalKg += m.totalProductionKg;
          totalSales += m.totalSalesValue;
          totalSailorsShare += m.totalSailorsShare;
          totalDebt += m.totalDebt;
          totalPurchases += m.totalPurchases;
          netFleetProfit += m.netVesselProfit;
          return { boat: b, metrics: m };
        });

        return {
          totalKg: totalKg,
          totalSales: totalSales,
          totalSailorsShare: totalSailorsShare,
          totalDebt: totalDebt,
          totalPurchases: totalPurchases,
          netFleetProfit: netFleetProfit,
          perBoat: perBoat
        };
      }

      /* ========================================================================
         6. الإشعارات والنوافذ المنبثقة

      function showToast(msg, type) {
        const box = document.getElementById('toast-container');
        if (!box) return;
        const el = document.createElement('div');
        el.className = 'toast-item ' + (type === 'error' ? 'toast-error' : (type === 'info' ? 'toast-info' : 'toast-success'));
        el.textContent = msg;
        box.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(-6px)';
          setTimeout(() => el.remove(), 250);
        }, 2300);
      }

      function openModal(id) {
        const el = document.getElementById(id);
        if (el) el.classList.add('open');
      }

      function closeModal(id) {
        const el = document.getElementById(id);
        if (el) el.classList.remove('open');
      }

      document.querySelectorAll('.modal-backdrop').forEach(bd => {
        bd.addEventListener('click', function (e) {
          if (e.target === bd) bd.classList.remove('open');
        });
      });

      let confirmCallback = null;
      function openConfirmModal(opts) {
        document.getElementById('confirm-title').textContent = opts.title || 'تأكيد';
        document.getElementById('confirm-msg').textContent = opts.message || '';
        const okBtn = document.getElementById('confirm-ok-btn');
        okBtn.className = 'btn ' + (opts.btnClass || 'btn-navy');
        okBtn.textContent = opts.okLabel || 'تأكيد';

        const checksWrap = document.getElementById('confirm-checks-wrap');
        const row1 = document.getElementById('confirm-check1-row');
        const row2 = document.getElementById('confirm-check2-row');
        const chk1 = document.getElementById('confirm-check1');
        const chk2 = document.getElementById('confirm-check2');

        if (opts.check1Label || opts.check2Label) {
          checksWrap.style.display = 'block';
          if (opts.check1Label) {
            row1.style.display = 'inline-flex';
            document.getElementById('confirm-check1-label').textContent = opts.check1Label;
            chk1.checked = opts.check1Default !== false;
          } else {
            row1.style.display = 'none';
          }
          if (opts.check2Label) {
            row2.style.display = 'inline-flex';
            document.getElementById('confirm-check2-label').textContent = opts.check2Label;
            chk2.checked = opts.check2Default !== false;
          } else {
            row2.style.display = 'none';
          }
        } else {
          checksWrap.style.display = 'none';
        }

        confirmCallback = opts.onConfirm || null;
        openModal('modal-confirm');
      }

      document.getElementById('confirm-ok-btn').addEventListener('click', function () {
        const cb = confirmCallback;
        const checks = {
          check1: document.getElementById('confirm-check1').checked,
          check2: document.getElementById('confirm-check2').checked
        };
        closeModal('modal-confirm');
        confirmCallback = null;
        if (typeof cb === 'function') cb(checks);
      });

                <span class="cat-badge cat-ice" dir="ltr">${fmtNum(sm.kg)} كغ</span>
