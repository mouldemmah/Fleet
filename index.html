              <div style="width:100%;font-size:10.5px;display:flex;flex-direction:column;gap:2px;">
                <div class="flex-between">
                  <span class="text-muted">المستحق:</span>
                  <strong class="text-amber" dir="ltr">${fmtMoney(sm.grossShare)}</strong>
                </div>
                <div class="flex-between">
                  <span class="text-muted">الدين:</span>
                  <strong class="text-red" dir="ltr">${fmtMoney(sm.debt)}</strong>
                </div>
              </div>

              <div class="flex-between" style="width:100%;background:#d1fae5;border-radius:7px;padding:3px 7px;">
                <span style="font-size:10px;font-weight:800;color:#065f46;">الصافي:</span>
                <strong style="font-size:11.5px;font-weight:900;color:#065f46;" dir="ltr">${fmtMoney(sm.netPayable)}</strong>
              </div>
            </button>
          `;
        }).join('');

        return `
          <!-- شريط أسعار حساب البحارة للسفينة النشطة مع زر تعديل مباشر -->
          <div class="card flex-between" style="flex-shrink:0;padding:6px 8px;background:#fffbeb;border-color:#fde68a;">
            <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:10.5px;font-weight:800;color:#92400e;">
              <span>أسعار البحارة:</span>
              <span dir="ltr">F:${fmtMoney(boat.pricing.F.crewPrice)}</span>
              <span dir="ltr">R:${fmtMoney(boat.pricing.R.crewPrice)}</span>
              <span dir="ltr">P:${fmtMoney(boat.pricing.P.crewPrice)}</span>
              <span dir="ltr">RR:${fmtMoney(boat.pricing.RR.crewPrice)}</span>
            </div>
            <button type="button" class="btn btn-xs btn-navy" onclick="openShipModal('${escHTML(boat.id)}', 'prices')">تعديل</button>
          </div>

          <!-- ملخص إجمالي البحارة -->
          <div class="grid-3" style="text-align:center;flex-shrink:0;">
            <div class="kpi-box" style="padding:5px 4px;">
              <div class="kpi-title">مجموع الحصص</div>
              <div class="kpi-num text-amber" style="font-size:13px;" dir="ltr">${fmtMoney(m.totalSailorsShare)}</div>
            </div>
            <div class="kpi-box" style="padding:5px 4px;">
              <div class="kpi-title">مجموع الديون</div>
              <div class="kpi-num text-red" style="font-size:13px;" dir="ltr">${fmtMoney(m.totalDebt)}</div>
            </div>
            <div class="kpi-box" style="padding:5px 4px;">
              <div class="kpi-title">الصافي للدفع</div>
              <div class="kpi-num text-emerald" style="font-size:13px;" dir="ltr">${fmtMoney(m.totalNetPaidToSailors)}</div>
            </div>
          </div>

          <!-- شبكة البحارة الستة (2×3) -->
          <div class="sailors-grid-2x3">
            ${cardsHTML}
          </div>
        `;
      }

      function openSailorModal(idx) {
        activeSailorIdx = idx;
        sailorModalSubTab = 'prod';
        renderSailorModalBody();
        openModal('modal-sailor');
      }

      function switchSailorModalSubTab(sub) {
        sailorModalSubTab = sub;
        renderSailorModalBody();
      }

      function renderSailorModalBody() {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        const sm = calcSailorMetrics(s, boat.pricing);

        document.getElementById('sm-title').textContent = (activeSailorIdx + 1) + '. ' + s.name + ' (' + boat.name + ')';

        const subTabBar = `
          <div class="subtab-bar">
            <button type="button" class="subtab-btn ${sailorModalSubTab === 'prod' ? 'active' : ''}" onclick="switchSailorModalSubTab('prod')">الإنتاج والاسم</button>
            <button type="button" class="subtab-btn ${sailorModalSubTab === 'debt' ? 'active' : ''}" onclick="switchSailorModalSubTab('debt')">الدين والسلفة</button>
          </div>
        `;

        let innerHTML = '';
        if (sailorModalSubTab === 'prod') {
          innerHTML = `
            <div class="stack-sm">
              <div>
                <label class="field-label">اسم البحار</label>
                <input type="text" class="input-field" value="${escHTML(s.name)}" oninput="onSailorModalNameInput(this.value)" />
              </div>

              <div>
                <label class="field-label">الإنتاج حسب العينة (كغ) — بسعر بحارة ${escHTML(boat.name)}</label>
                <div class="grid-2">
                  ${GRADES.map(g => `
                    <div class="card" style="background:#f8fafc;padding:7px 8px;">
                      <div class="flex-between" style="margin-bottom:4px;">
                        <span class="grade-pill ${GRADE_INFO[g].cls}">${g}</span>
                        <span style="font-size:10px;color:#d97706;font-weight:800;" dir="ltr">${fmtMoney(boat.pricing[g].crewPrice)}/كغ</span>
                      </div>
                      <input type="number" min="0" step="any" class="input-field input-compact"
                        value="${s.production[g] || ''}" placeholder="0"
                        oninput="onSailorModalProdInput('${g}', this.value)" />
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="flex-between" style="background:#fef3c7;border:1px solid #fde68a;border-radius:10px;padding:8px 10px;">
                <span style="font-size:11px;font-weight:800;color:#92400e;">المجموع: <strong id="sm-tot-kg" dir="ltr">${fmtNum(sm.kg)}</strong> كغ</span>
                <span style="font-size:12px;font-weight:900;color:#b45309;">المستحق: <strong id="sm-tot-share" dir="ltr">${fmtMoney(sm.grossShare)}</strong> ${escHTML(state.currency)}</span>
              </div>
            </div>
          `;
        } else {
          innerHTML = `
            <div class="stack-sm">
              <div class="grid-2">
                <div class="kpi-box" style="background:#fee2e2;border-color:#fecaca;">
                  <div class="kpi-title" style="color:#991b1b;">الدين الحالي</div>
                  <div class="kpi-num text-red" id="sm-debt-disp" dir="ltr">${fmtMoney(sm.debt)}</div>
                </div>
                <div class="kpi-box" style="background:#d1fae5;border-color:#a7f3d0;">
                  <div class="kpi-title" style="color:#065f46;">الصافي للدفع</div>
                  <div class="kpi-num text-emerald" id="sm-net-disp" dir="ltr">${fmtMoney(sm.netPayable)}</div>
                </div>
              </div>

              <div class="card" style="background:#f8fafc;padding:8px;">
                <label class="field-label">إضافة سلفة أو تسجيل سداد (${escHTML(state.currency)})</label>
                <div class="grid-3" style="margin-bottom:6px;">
                  <input type="number" min="0" step="any" id="sm-adv-amount" class="input-field input-compact" placeholder="المبلغ" />
                  <button type="button" class="btn btn-xs btn-cyan" onclick="applySailorModalDebtDelta(1)">+ إضافة سلفة</button>
                  <button type="button" class="btn btn-xs btn-emerald" onclick="applySailorModalDebtDelta(-1)">- خصم سداد</button>
                </div>
                <div class="pill-row">
                  <button type="button" class="sel-pill" onclick="setSailorAdvPreset(1000)">1,000</button>
                  <button type="button" class="sel-pill" onclick="setSailorAdvPreset(2000)">2,000</button>
                  <button type="button" class="sel-pill" onclick="setSailorAdvPreset(5000)">5,000</button>
                  <button type="button" class="sel-pill" onclick="setSailorAdvPreset(10000)">10,000</button>
                </div>
              </div>

              <div class="card" style="background:#f8fafc;padding:8px;">
                <div class="grid-2" style="align-items:center;margin-bottom:6px;">
                  <div>
                    <label class="field-label">تعديل الدين مباشرة</label>
                    <input type="number" min="0" step="any" class="input-field input-compact text-red"
                      value="${s.debt || ''}" placeholder="0"
                      oninput="onSailorModalDirectDebt(this.value)" />
                  </div>
                  <div>
                    <label class="field-label">المخصوم من الحصة</label>
                    ${s.autoDeduct
                      ? '<div class="input-field input-compact text-red" style="background:#fff;" id="sm-deduct-disp" dir="ltr">' + fmtMoney(sm.deduction) + '</div>'
                      : '<input type="number" min="0" step="any" class="input-field input-compact text-red" value="' + (s.manualDeduction || '') + '" placeholder="0" oninput="onSailorModalManualDeduct(this.value)" />'
                    }
                  </div>
                </div>
                <div class="flex-between">
                  <label class="toggle-pill">
                    <input type="checkbox" ${s.autoDeduct ? 'checked' : ''} onchange="onSailorModalAutoToggle(this.checked)" />
                    <span>خصم تلقائي من الحصة</span>
                  </label>
                  <span style="font-size:10.5px;font-weight:800;color:#64748b;">متبقي الدين: <strong id="sm-remdebt-disp" dir="ltr">${fmtMoney(sm.remainingDebt)}</strong></span>
                </div>
              </div>
            </div>
          `;
        }

        document.getElementById('sm-body').innerHTML = `
          ${subTabBar}
          <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;">
            ${innerHTML}
          </div>
          <button type="button" class="btn btn-navy btn-block" onclick="closeModal('modal-sailor')">تم وحفظ</button>
        `;
      }

      function onSailorModalNameInput(val) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        s.name = val || ('بحار ' + (activeSailorIdx + 1));
        document.getElementById('sm-title').textContent = (activeSailorIdx + 1) + '. ' + s.name + ' (' + boat.name + ')';
        persistState(true, 'تغيير اسم البحار إلى ' + s.name);
        renderActiveTab();
      }

      function onSailorModalProdInput(grade, rawVal) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        s.production[grade] = Math.max(0, numVal(rawVal));
        persistState(true, 'تحديث إنتاج ' + s.name);
        const sm = calcSailorMetrics(s, boat.pricing);
        const elKg = document.getElementById('sm-tot-kg');
        const elShare = document.getElementById('sm-tot-share');
        if (elKg) elKg.textContent = fmtNum(sm.kg);
        if (elShare) elShare.textContent = fmtMoney(sm.grossShare);
        renderActiveTab();
      }

      function setSailorAdvPreset(amt) {
        const inp = document.getElementById('sm-adv-amount');
        if (inp) inp.value = amt;
      }

      function applySailorModalDebtDelta(sign) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        const inp = document.getElementById('sm-adv-amount');
        const amt = Math.max(0, numVal(inp ? inp.value : 0));
        if (amt <= 0) {
          showToast('الرجاء إدخال مبلغ أكبر من الصفر', 'error');
          return;
        }
        s.debt = Math.max(0, numVal(s.debt) + sign * amt);
        persistState(true, (sign > 0 ? 'سلفة ' : 'سداد ') + fmtMoney(amt) + ' لـ ' + s.name);
        renderSailorModalBody();
        renderActiveTab();
        showToast(sign > 0 ? 'تمت إضافة السلفة بنجاح' : 'تم خصم السداد بنجاح', 'success');
      }

      function onSailorModalDirectDebt(rawVal) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        s.debt = Math.max(0, numVal(rawVal));
        persistState(true, 'تعديل دين ' + s.name);
        const sm = calcSailorMetrics(s, boat.pricing);
        const elD = document.getElementById('sm-debt-disp');
        const elN = document.getElementById('sm-net-disp');
        const elDed = document.getElementById('sm-deduct-disp');
        const elRem = document.getElementById('sm-remdebt-disp');
        if (elD) elD.textContent = fmtMoney(sm.debt);
        if (elN) elN.textContent = fmtMoney(sm.netPayable);
        if (elDed) elDed.textContent = fmtMoney(sm.deduction);
        if (elRem) elRem.textContent = fmtMoney(sm.remainingDebt);
        renderActiveTab();
      }

      function onSailorModalAutoToggle(checked) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        s.autoDeduct = Boolean(checked);
        persistState(true, 'تغيير نمط خصم الدين لـ ' + s.name);
        renderSailorModalBody();
        renderActiveTab();
      }

      function onSailorModalManualDeduct(rawVal) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        s.manualDeduction = Math.max(0, numVal(rawVal));
        persistState(true, 'تعديل الخصم اليدوي لـ ' + s.name);
        const sm = calcSailorMetrics(s, boat.pricing);
        const elN = document.getElementById('sm-net-disp');
        const elRem = document.getElementById('sm-remdebt-disp');
        if (elN) elN.textContent = fmtMoney(sm.netPayable);
        if (elRem) elRem.textContent = fmtMoney(sm.remainingDebt);
        renderActiveTab();
      }

      /* ========================================================================
         11. الشاشة 4: المشتريات (لائحة مرقمة 4 بنود بالصفحة)
         ======================================================================== */
      function getFilteredPurchases(boat) {
        const q = purchaseSearch.trim().toLowerCase();
        return boat.purchases.filter(p => {
          const matchCat = purchaseCatFilter === 'ALL' || p.category === purchaseCatFilter;
          const matchQ = !q || p.item.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
          return matchCat && matchQ;
        });
      }

      function renderPurchasesTab() {
        const boat = getActiveBoat();
        const m = calcBoatMetrics(boat);
        const filtered = getFilteredPurchases(boat);
        const paged = paginateArray(filtered, purchasesPage, 4);
        purchasesPage = paged.page;

        const catPills = ['ALL'].concat(PURCHASE_CATEGORIES).map(c => `
          <button type="button" class="sel-pill ${purchaseCatFilter === c ? 'active' : ''}" onclick="onPurchaseFilter('${c}')">
            ${c === 'ALL' ? 'الكل' : c}
          </button>
        `).join('');

        return `
          <!-- ملخص المشتريات -->
          <div class="hero-card" style="padding:8px 11px;">
            <div class="flex-between">
              <div>
                <div class="hero-label">مشتريات ومحروقات — ${escHTML(boat.name)}</div>
                <div style="font-size:18px;font-weight:900;" dir="ltr">${fmtMoney(m.totalPurchases)} <span class="hero-currency">${escHTML(state.currency)}</span></div>
              </div>
              <button type="button" class="btn btn-sm btn-cyan" onclick="openPurchaseModal(null)">+ إضافة</button>
            </div>
            <div class="grid-2" style="margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,0.14);font-size:10.5px;color:#bae6fd;">
              <div>المحروقات: <strong style="color:#fca5a5;" dir="ltr">${fmtMoney(m.fuelTotal)}</strong></div>
              <div>المعاش والمصروفات: <strong style="color:#fde68a;" dir="ltr">${fmtMoney(m.otherExpensesTotal)}</strong></div>
            </div>
          </div>

          <!-- شريط البحث والتصفية -->
          <div class="card stack-xs" style="flex-shrink:0;padding:7px 9px;">
            <div class="pill-row">${catPills}</div>
            <input type="text" class="input-field" value="${escHTML(purchaseSearch)}" placeholder="بحث في لائحة المشتريات..." oninput="onPurchaseSearch(this.value)" />
          </div>

          <!-- اللائحة المرقمة (4 بنود بالصفحة) -->
          <div class="card flex-fill-card">
            <div class="paged-items-wrap" id="purchases-paged-list">
              ${renderPurchasesItemsHTML(paged.items)}
            </div>
            <div id="purchases-pager-wrap">
              ${renderPagerHTML(paged.page, paged.totalPages, paged.total, 'changePurchasesPage(-1)', 'changePurchasesPage(1)')}
            </div>
          </div>
        `;
      }

      function renderPurchasesItemsHTML(items) {
        if (items.length === 0) {
          return '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#64748b;font-weight:700;font-size:12px;">لا توجد مشتريات في هذا النطاق.</div>';
        }
        return items.map(p => `
          <div class="list-row-card">
            <div style="min-width:0;">
              <div style="display:flex;align-items:center;gap:5px;">
                <strong style="font-size:11.5px;color:#0f2942;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:145px;">${escHTML(p.item)}</strong>
                <span class="cat-badge ${getCategoryClass(p.category)}">${escHTML(p.category)}</span>
              </div>
              <div style="font-size:9.5px;color:#64748b;" dir="ltr">${escHTML(p.date)}</div>
            </div>
            <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
              <strong class="text-red" style="font-size:11.5px;" dir="ltr">${fmtMoney(p.amount)}</strong>
              <button type="button" class="btn btn-xs btn-ghost" onclick="openPurchaseModal('${escHTML(p.id)}')">تعديل</button>
              <button type="button" class="btn btn-xs btn-red" onclick="deletePurchase('${escHTML(p.id)}')">حذف</button>
            </div>
          </div>
        `).join('');
      }

      function onPurchaseSearch(val) {
        purchaseSearch = val;
        purchasesPage = 1;
        const boat = getActiveBoat();
        const filtered = getFilteredPurchases(boat);
        const paged = paginateArray(filtered, purchasesPage, 4);
        const listEl = document.getElementById('purchases-paged-list');
        const pagerEl = document.getElementById('purchases-pager-wrap');
        if (listEl) listEl.innerHTML = renderPurchasesItemsHTML(paged.items);
        if (pagerEl) pagerEl.innerHTML = renderPagerHTML(paged.page, paged.totalPages, paged.total, 'changePurchasesPage(-1)', 'changePurchasesPage(1)');
      }

      function onPurchaseFilter(cat) {
        purchaseCatFilter = cat;
        purchasesPage = 1;
        renderActiveTab();
      }

      function changePurchasesPage(delta) {
        purchasesPage += delta;
        renderActiveTab();
      }

      function openPurchaseModal(purId) {
        const boat = getActiveBoat();
        updateCurrencyLabels();
        if (purId) {
          const p = boat.purchases.find(x => x.id === purId);
          if (!p) return;
          document.getElementById('pm-title').textContent = 'تعديل بند شراء';
          document.getElementById('pm-id').value = p.id;
          document.getElementById('pm-item').value = p.item;
          document.getElementById('pm-cat').value = p.category;
          document.getElementById('pm-amount').value = p.amount;
          document.getElementById('pm-date').value = p.date;
        } else {
          document.getElementById('pm-title').textContent = 'إضافة شراء جديد — ' + boat.name;
          document.getElementById('pm-id').value = '';
          document.getElementById('pm-item').value = '';
          document.getElementById('pm-cat').value = 'محروقات';
          document.getElementById('pm-amount').value = '';
          document.getElementById('pm-date').value = boat.todayDate || getTodayISO();
        }
        openModal('modal-purchase');
      }

      function savePurchaseForm(e) {
        e.preventDefault();
        const boat = getActiveBoat();
        const id = document.getElementById('pm-id').value.trim();
        const item = document.getElementById('pm-item').value.trim();
        const category = document.getElementById('pm-cat').value;
        const amount = Math.max(0, numVal(document.getElementById('pm-amount').value));
        const date = document.getElementById('pm-date').value || boat.todayDate || getTodayISO();

        if (!item || amount <= 0) {
          showToast('الرجاء إدخال البيان ومبلغ أكبر من الصفر', 'error');
          return;
        }

        if (id) {
          const p = boat.purchases.find(x => x.id === id);
          if (p) {
            p.item = item;
            p.category = category;
            p.amount = amount;
            p.date = date;
            persistState(true, 'تعديل شراء (' + boat.name + '): ' + item);
            showToast('تم تحديث البند بنجاح', 'success');
          }
        } else {
          boat.purchases.unshift({
            id: 'pur-' + Date.now(),
            date: date,
            item: item,
            category: category,
            amount: amount
          });
          purchasesPage = 1;
          persistState(true, 'إضافة شراء (' + boat.name + '): ' + item);
          showToast('تمت إضافة الشراء إلى اللائحة', 'success');
        }

        closeModal('modal-purchase');
        renderActiveTab();
      }

      function deletePurchase(purId) {
        const boat = getActiveBoat();
        boat.purchases = boat.purchases.filter(p => p.id !== purId);
        persistState(true, 'حذف بند من مشتريات ' + boat.name);
        renderActiveTab();
        showToast('تم حذف البند', 'info');
      }

      /* ========================================================================
         12. الشاشة 5: المسير (إنتاج ومصروف فقط + نوافذ إضافة نظيفة)
         ======================================================================== */
      function getMgrDefaultUnitPrice(boat, grade, mode) {
        const p = boat.pricing[grade] || { sellPrice: 0, crewPrice: 0 };
        return mode === 'crew' ? p.crewPrice : p.sellPrice;
      }

      function renderManagerTab() {
        const boat = getActiveBoat();
        const selectedDate = boat.todayDate || getTodayISO();
        const allProd = boat.managerProduction || [];
        const allExp = boat.managerExpenses || [];

        const scopedProd = mgrDateScope === 'selected' ? allProd.filter(x => x.date === selectedDate) : allProd;
        const scopedExp = mgrDateScope === 'selected' ? allExp.filter(x => x.date === selectedDate) : allExp;

        let prodKg = 0;
        let prodVal = 0;
        scopedProd.forEach(mp => {
          const kg = Math.max(0, numVal(mp.kg));
          const pr = Math.max(0, numVal(mp.unitPrice));
          prodKg += kg;
          prodVal += kg * pr;
        });

        let expTotal = 0;
        scopedExp.forEach(me => {
          expTotal += Math.max(0, numVal(me.amount));
        });
        const netMgr = prodVal - expTotal;

        let listCardHTML = '';
        if (mgrSubTab === 'prod') {
          const pagedProd = paginateArray(scopedProd, mgrProdPage, 4);
          mgrProdPage = pagedProd.page;

          const rowsHTML = pagedProd.items.length === 0
            ? '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px;font-weight:700;">لا يوجد إنتاج مسجل للمسير في هذا النطاق.</div>'
            : pagedProd.items.map(mp => {
                const val = Math.max(0, numVal(mp.kg)) * Math.max(0, numVal(mp.unitPrice));
                return `
                  <div class="list-row-card">
                    <div style="min-width:0;">
                      <div style="display:flex;align-items:center;gap:5px;">
                        <span class="grade-pill ${GRADE_INFO[mp.grade].cls}">${escHTML(mp.grade)}</span>
                        <strong style="font-size:12px;color:#0f2942;" dir="ltr">${fmtNum(mp.kg)} كغ</strong>
                        <span style="font-size:10px;color:#64748b;">سعر <span dir="ltr">${fmtMoney(mp.unitPrice)}</span></span>
                      </div>
                      <div style="font-size:9.5px;color:#64748b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px;">
                        <span dir="ltr">${escHTML(mp.date)}</span>${mp.note ? ' • ' + escHTML(mp.note) : ''}
                      </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
                      <strong class="text-emerald" style="font-size:12px;" dir="ltr">${fmtMoney(val)}</strong>
                      <button type="button" class="btn btn-xs btn-red" onclick="deleteMgrProduction('${escHTML(mp.id)}')">حذف</button>
                    </div>
                  </div>
                `;
              }).join('');

          listCardHTML = `
            <div class="card flex-fill-card">
              <div class="paged-items-wrap">${rowsHTML}</div>
              ${renderPagerHTML(pagedProd.page, pagedProd.totalPages, pagedProd.total, 'changeMgrProdPage(-1)', 'changeMgrProdPage(1)')}
            </div>
          `;
        } else {
          const pagedExp = paginateArray(scopedExp, mgrExpPage, 4);
          mgrExpPage = pagedExp.page;

          const rowsHTML = pagedExp.items.length === 0
            ? '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px;font-weight:700;">لا توجد مصاريف مسجلة للمسير في هذا النطاق.</div>'
            : pagedExp.items.map(me => `
                <div class="list-row-card">
                  <div style="min-width:0;">
                    <div style="display:flex;align-items:center;gap:5px;">
                      <strong style="font-size:12px;color:#0f2942;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;">${escHTML(me.item)}</strong>
                      <span class="cat-badge ${getCategoryClass(me.category)}">${escHTML(me.category)}</span>
                    </div>
                    <div style="font-size:9.5px;color:#64748b;" dir="ltr">${escHTML(me.date)}</div>
                  </div>
                  <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
                    <strong class="text-red" style="font-size:12px;" dir="ltr">${fmtMoney(me.amount)}</strong>
                    <button type="button" class="btn btn-xs btn-red" onclick="deleteMgrExpense('${escHTML(me.id)}')">حذف</button>
                  </div>
                </div>
              `).join('');

          listCardHTML = `
            <div class="card flex-fill-card">
              <div class="paged-items-wrap">${rowsHTML}</div>
              ${renderPagerHTML(pagedExp.page, pagedExp.totalPages, pagedExp.total, 'changeMgrExpPage(-1)', 'changeMgrExpPage(1)')}
            </div>
          `;
        }

        return `
          <!-- شريط التحديد العلوي والملخص الفوري -->
          <div class="hero-card" style="padding:8px 10px;">
            <div style="display:flex;align-items:center;gap:5px;margin-bottom:6px;">
              <select class="input-field" style="flex:1;background:rgba(255,255,255,0.14);color:#fff;border-color:rgba(56,189,248,0.45);padding:4px 6px;font-size:11px;" onchange="selectBoat(this.value)">
                ${state.boats.map(b => '<option value="' + escHTML(b.id) + '" style="color:#0f172a;" ' + (b.id === boat.id ? 'selected' : '') + '>' + escHTML(b.name) + ' (' + escHTML(b.captain) + ')</option>').join('')}
              </select>
              <input type="date" class="input-field" style="width:116px;background:rgba(255,255,255,0.14);color:#fff;border-color:rgba(56,189,248,0.45);padding:4px 5px;font-size:10.5px;" value="${escHTML(selectedDate)}" onchange="onTodayDateChange(this.value)" />
              <button type="button" class="btn btn-xs ${mgrDateScope === 'all' ? 'btn-cyan' : 'btn-light-alpha'}" onclick="toggleMgrDateScope()">
                ${mgrDateScope === 'all' ? 'كل التواريخ' : 'التاريخ المحدد'}
              </button>
            </div>
            <div class="grid-3" style="background:rgba(255,255,255,0.1);border-radius:9px;padding:5px 4px;text-align:center;">
              <div>
                <div style="font-size:9.5px;color:#bae6fd;font-weight:700;">الإنتاج (<span dir="ltr">${fmtNum(prodKg)}</span> كغ)</div>
                <div style="font-size:13px;font-weight:900;color:#34d399;" dir="ltr">${fmtMoney(prodVal)}</div>
              </div>
              <div style="border-inline:1px solid rgba(255,255,255,0.18);">
                <div style="font-size:9.5px;color:#bae6fd;font-weight:700;">المصروف</div>
                <div style="font-size:13px;font-weight:900;color:#fca5a5;" dir="ltr">${fmtMoney(expTotal)}</div>
              </div>
              <div>
                <div style="font-size:9.5px;color:#bae6fd;font-weight:700;">الصافي</div>
                <div style="font-size:13px;font-weight:900;color:#ffffff;" dir="ltr">${fmtMoney(netMgr)}</div>
              </div>
            </div>
          </div>

          <!-- المحول الثنائي مع زر إضافة -->
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
            <div class="subtab-bar" style="flex:1;">
              <button type="button" class="subtab-btn ${mgrSubTab === 'prod' ? 'active' : ''}" onclick="switchMgrSubTab('prod')">الإنتاج</button>
              <button type="button" class="subtab-btn ${mgrSubTab === 'exp' ? 'active' : ''}" onclick="switchMgrSubTab('exp')">المصروف</button>
            </div>
            <button type="button" class="btn btn-sm ${mgrSubTab === 'prod' ? 'btn-emerald' : 'btn-navy'}" onclick="${mgrSubTab === 'prod' ? 'openMgrProdModal()' : 'openMgrExpModal()'}">+ إضافة</button>
          </div>

          ${listCardHTML}
        `;
      }

      function switchMgrSubTab(sub) {
        mgrSubTab = sub;
        renderActiveTab();
      }

      function toggleMgrDateScope() {
        mgrDateScope = mgrDateScope === 'selected' ? 'all' : 'selected';
        mgrProdPage = 1;
        mgrExpPage = 1;
        renderActiveTab();
      }

      function changeMgrProdPage(delta) {
        mgrProdPage += delta;
        renderActiveTab();
      }

      function changeMgrExpPage(delta) {
        mgrExpPage += delta;
        renderActiveTab();
      }

      function renderMgrProdModalSelectors() {
        const boat = getActiveBoat();
        const gradesEl = document.getElementById('mpm-grades');
        const modesEl = document.getElementById('mpm-modes');
        if (gradesEl) {
          gradesEl.innerHTML = GRADES.map(g =>
            '<button type="button" class="sel-pill ' + (mgrModalGrade === g ? 'active' : '') + '" onclick="onMgrModalGrade(\'' + g + '\')">' + g + '</button>'
          ).join('');
        }
        if (modesEl) {
          const modes = [
            { id: 'sell', label: 'سعر البيع' },
            { id: 'crew', label: 'سعر البحارة' },
            { id: 'custom', label: 'سعر مخصص' }
          ];
          modesEl.innerHTML = modes.map(m =>
            '<button type="button" class="sel-pill ' + (mgrModalPriceMode === m.id ? 'active' : '') + '" onclick="onMgrModalPriceMode(\'' + m.id + '\')">' + m.label + '</button>'
          ).join('');
        }
        const priceInp = document.getElementById('mpm-price');
        if (priceInp && mgrModalPriceMode !== 'custom') {
          priceInp.value = getMgrDefaultUnitPrice(boat, mgrModalGrade, mgrModalPriceMode);
        }
      }

      function openMgrProdModal() {
        updateCurrencyLabels();
        mgrModalGrade = 'F';
        mgrModalPriceMode = 'sell';
        document.getElementById('mpm-kg').value = '';
        document.getElementById('mpm-note').value = '';
        renderMgrProdModalSelectors();
        openModal('modal-mgr-prod');
      }

      function onMgrModalGrade(g) {
        mgrModalGrade = g;
        renderMgrProdModalSelectors();
      }

      function onMgrModalPriceMode(mode) {
        mgrModalPriceMode = mode;
        renderMgrProdModalSelectors();
        if (mode === 'custom') {
          const pInp = document.getElementById('mpm-price');
          if (pInp) {
            pInp.focus();
            pInp.select();
          }
        }
      }

      function submitMgrProdForm(e) {
        e.preventDefault();
        const boat = getActiveBoat();
        const kg = Math.max(0, numVal(document.getElementById('mpm-kg').value));
        const unitPrice = Math.max(0, numVal(document.getElementById('mpm-price').value));
        const note = document.getElementById('mpm-note').value.trim();

        if (kg <= 0) {
          showToast('الرجاء إدخال وزن أكبر من الصفر', 'error');
          return;
        }
        if (!Array.isArray(boat.managerProduction)) boat.managerProduction = [];
        boat.managerProduction.unshift({
          id: 'mp-' + Date.now(),
          date: boat.todayDate || getTodayISO(),
          grade: mgrModalGrade,
          kg: kg,
          unitPrice: unitPrice,
          note: note
        });
        mgrProdPage = 1;
        persistState(true, 'إضافة إنتاج المسير (' + boat.name + ')');
        closeModal('modal-mgr-prod');
        renderActiveTab();
        showToast('تم تسجيل إنتاج المسير', 'success');
      }

      function deleteMgrProduction(id) {
        const boat = getActiveBoat();
        boat.managerProduction = (boat.managerProduction || []).filter(x => x.id !== id);
        persistState(true, 'حذف سجل إنتاج للمسير (' + boat.name + ')');
        renderActiveTab();
        showToast('تم حذف سجل الإنتاج', 'info');
      }

      function renderMgrExpModalCats() {
        const catsEl = document.getElementById('mem-cats');
        if (!catsEl) return;
        catsEl.innerHTML = MGR_EXPENSE_CATEGORIES.map(c =>
          '<button type="button" class="sel-pill ' + (mgrModalExpCat === c ? 'active' : '') + '" onclick="onMgrModalExpCat(\'' + c + '\')">' + c + '</button>'
        ).join('');
      }

      function openMgrExpModal() {
        updateCurrencyLabels();
        mgrModalExpCat = 'محروقات';
        document.getElementById('mem-item').value = '';
        document.getElementById('mem-amount').value = '';
        renderMgrExpModalCats();
        openModal('modal-mgr-exp');
      }

      function onMgrModalExpCat(cat) {
        mgrModalExpCat = cat;
        renderMgrExpModalCats();
      }

      function submitMgrExpForm(e) {
        e.preventDefault();
        const boat = getActiveBoat();
        const item = document.getElementById('mem-item').value.trim();
        const amount = Math.max(0, numVal(document.getElementById('mem-amount').value));

        if (!item || amount <= 0) {
          showToast('الرجاء إدخال البيان ومبلغ أكبر من الصفر', 'error');
          return;
        }
        if (!Array.isArray(boat.managerExpenses)) boat.managerExpenses = [];
        boat.managerExpenses.unshift({
          id: 'me-' + Date.now(),
          date: boat.todayDate || getTodayISO(),
          item: item,
          category: mgrModalExpCat,
          amount: amount
        });
        mgrExpPage = 1;
        persistState(true, 'إضافة مصروف المسير (' + boat.name + '): ' + item);
        closeModal('modal-mgr-exp');
        renderActiveTab();
        showToast('تم تسجيل مصروف المسير', 'success');
      }

      function deleteMgrExpense(id) {
        const boat = getActiveBoat();
        boat.managerExpenses = (boat.managerExpenses || []).filter(x => x.id !== id);
        persistState(true, 'حذف مصروف للمسير (' + boat.name + ')');
        renderActiveTab();
        showToast('تم حذف المصروف', 'info');
      }

      /* ========================================================================
         13. الشاشة 6: الأسعار (4 بطاقات متساوية بدون جداول فرعية)
         ======================================================================== */
      function renderPricingTab() {
        const boat = getActiveBoat();

        const cardsHTML = GRADES.map(g => {
          const info = GRADE_INFO[g];
          const sell = boat.pricing[g].sellPrice;
          const crew = boat.pricing[g].crewPrice;
          const diff = sell - crew;
          return `
            <div class="card flex-between" style="padding:7px 10px;gap:8px;">
              <div style="min-width:95px;">
                <span class="grade-pill ${info.cls}">${info.label} — ${info.desc}</span>
                <div style="font-size:10px;font-weight:800;margin-top:4px;color:${diff >= 0 ? '#059669' : '#dc2626'};" id="price-diff-${g}">
                  الفارق: <span dir="ltr">${fmtMoney(diff)}</span>
                </div>
              </div>

              <div style="flex:1;max-width:120px;">
                <label class="field-label" style="margin-bottom:2px;">سعر البيع الفعلي</label>
                <input type="number" min="0" step="any"
                  class="input-field input-compact text-navy"
                  value="${sell}"
                  oninput="onSellPriceInput('${g}', this.value)" />
              </div>

              <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:5px 8px;text-align:center;min-width:92px;">
                <div style="font-size:9px;font-weight:800;color:#92400e;">سعر البحارة</div>
                <div style="font-size:13px;font-weight:900;color:#d97706;" dir="ltr">${fmtMoney(crew)}</div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="card flex-between" style="flex-shrink:0;padding:7px 9px;">
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-size:11px;font-weight:800;color:#0f2942;">العملة:</span>
              <input type="text" class="input-field" style="width:74px;padding:4px 6px;text-align:center;font-size:11.5px;" value="${escHTML(state.currency)}" oninput="onCurrencyChange(this.value)" />
            </div>
            <button type="button" class="btn btn-xs btn-navy" onclick="applySellPricesToAll()">تعميم سعر البيع فقط للكل</button>
          </div>

          <div class="pricing-grid-4">
            ${cardsHTML}
          </div>
        `;
      }

      function onCurrencyChange(val) {
        state.currency = val.trim() || 'أوقية';
        persistState(true, 'تغيير العملة إلى ' + state.currency);
      }

      function onSellPriceInput(grade, rawVal) {
        const boat = getActiveBoat();
        const sell = Math.max(0, numVal(rawVal));
        boat.pricing[grade].sellPrice = sell;
        persistState(true, 'تعديل سعر بيع ' + grade + ' لسفينة ' + boat.name);

        const diff = sell - boat.pricing[grade].crewPrice;
        const diffEl = document.getElementById('price-diff-' + grade);
        if (diffEl) {
          diffEl.style.color = diff >= 0 ? '#059669' : '#dc2626';
          diffEl.innerHTML = 'الفارق: <span dir="ltr">' + fmtMoney(diff) + '</span>';
        }
      }

      function applySellPricesToAll() {
        const src = getActiveBoat();
        state.boats.forEach(b => {
          if (b.id !== src.id) {
            GRADES.forEach(g => { b.pricing[g].sellPrice = src.pricing[g].sellPrice; });
          }
        });
        persistState(true, 'تعميم سعر البيع فقط على كافة السفن');
        showToast('تم تعميم سعر البيع الفعلي فقط للكل مع حفظ أسعار بحارة كل سفينة', 'success');
      }

      /* ========================================================================
         14. الشاشة 7: السفن (لائحة مرقمة + نافذة السفينة بتبويبين)
         ======================================================================== */
      function renderBoatsTab() {
        const activeId = state.activeBoatId;
        const paged = paginateArray(state.boats, boatsPage, 3);
        boatsPage = paged.page;

        const cardsHTML = paged.items.map(b => {
          const m = calcBoatMetrics(b);
          const isActive = b.id === activeId;
          return `
            <div class="card" style="padding:8px 10px;${isActive ? 'border:2px solid #0284c7;background:#f0f9ff;' : ''}">
              <div class="flex-between" style="cursor:pointer;" onclick="openShipModal('${escHTML(b.id)}', 'info')">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                  <div style="width:34px;height:34px;border-radius:10px;background:#ffffff;border:1px solid #cbd5e1;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <svg width="21" height="21" viewBox="0 0 32 32" fill="none">
                      <rect x="13" y="5" width="6" height="4" rx="1" fill="#0f2942"/>
                      <path d="M8 9H24L25.5 17H6.5L8 9Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
                      <path d="M4 17H28L25 24.5H7L4 17Z" fill="#dc2626"/>
                      <path d="M3 26C6 24.5 9 27.5 12 26C15 24.5 18 27.5 21 26C24 24.5 27 27.5 29 26" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <div style="min-width:0;">
                    <div style="display:flex;align-items:center;gap:5px;">
                      <strong style="font-size:13px;color:#0f2942;">${escHTML(b.name)}</strong>
                      ${isActive ? '<span class="cat-badge cat-ice">نشطة</span>' : ''}
                    </div>
                    <div style="font-size:10px;color:#64748b;">الربان: ${escHTML(b.captain)} • 6 بحارة</div>
                  </div>
                </div>
                <div style="text-align:left;flex-shrink:0;">
                  <div style="font-size:9.5px;color:#64748b;">الصافي</div>
                  <div class="${m.netVesselProfit >= 0 ? 'text-emerald' : 'text-red'}" style="font-size:13px;font-weight:900;" dir="ltr">${fmtMoney(m.netVesselProfit)}</div>
                </div>
              </div>

              <div class="grid-3" style="margin-top:6px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;padding:4px 6px;text-align:center;font-size:10px;">
                <div><span class="text-muted">إنتاج:</span> <strong dir="ltr">${fmtNum(m.totalProductionKg)} كغ</strong></div>
                <div><span class="text-muted">بيع:</span> <strong dir="ltr">${fmtMoney(m.totalSalesValue)}</strong></div>
                <div><span class="text-muted">ديون:</span> <strong class="text-red" dir="ltr">${fmtMoney(m.totalDebt)}</strong></div>
              </div>

              <div class="grid-2" style="margin-top:6px;">
                <button type="button" class="btn btn-xs ${isActive ? 'btn-navy' : 'btn-ghost'}" onclick="selectBoat('${escHTML(b.id)}')">
                  ${isActive ? 'السفينة النشطة' : 'تفعيل السفينة'}
                </button>
                <button type="button" class="btn btn-xs btn-cyan" onclick="openShipModal('${escHTML(b.id)}', 'info')">تعديل السفينة والأسعار</button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div class="flex-between" style="flex-shrink:0;">
            <div>
              <div class="sec-title">أسطول السفن (${state.boats.length})</div>
              <div class="sec-subtitle">تعديل بيانات كل سفينة وأسعار بحارتها من داخلها</div>
            </div>
            <button type="button" class="btn btn-xs btn-navy" onclick="openShipModal(null, 'info')">+ إضافة سفينة</button>
          </div>

          <div class="card flex-fill-card" style="background:transparent;border:none;box-shadow:none;padding:0;">
            <div class="paged-items-wrap">${cardsHTML}</div>
            ${paged.totalPages > 1 ? '<div class="card" style="padding:4px 8px;margin-top:4px;">' + renderPagerHTML(paged.page, paged.totalPages, paged.total, 'changeBoatsPage(-1)', 'changeBoatsPage(1)') + '</div>' : ''}
          </div>
        `;
      }

      function changeBoatsPage(delta) {
        boatsPage += delta;
        renderActiveTab();
      }

      function switchShipModalSubTab(sub) {
        const infoBtn = document.getElementById('ship-st-btn-info');
        const priceBtn = document.getElementById('ship-st-btn-prices');
        const infoDiv = document.getElementById('ship-st-info');
        const priceDiv = document.getElementById('ship-st-prices');

        infoBtn.classList.toggle('active', sub === 'info');
        priceBtn.classList.toggle('active', sub === 'prices');
        infoDiv.style.display = sub === 'info' ? 'block' : 'none';
        priceDiv.style.display = sub === 'prices' ? 'block' : 'none';
      }

      function openShipModal(boatId, startSubTab) {
        updateCurrencyLabels();
        switchShipModalSubTab(startSubTab === 'prices' ? 'prices' : 'info');
        const isEdit = Boolean(boatId);
        const boat = isEdit ? state.boats.find(b => b.id === boatId) : null;
        const sailorInputs = document.querySelectorAll('.ship-sailor-name');
        const delWrap = document.getElementById('ship-form-delete-wrap');

        if (isEdit && boat) {
          document.getElementById('ship-form-title').textContent = 'تعديل السفينة — ' + boat.name;
          document.getElementById('ship-form-id').value = boat.id;
          document.getElementById('ship-form-name').value = boat.name;
          document.getElementById('ship-form-captain').value = boat.captain;

          sailorInputs.forEach((inp, i) => {
            inp.value = (boat.sailors[i] && boat.sailors[i].name) || ('بحار ' + (i + 1));
          });
          GRADES.forEach(g => {
            document.getElementById('ship-form-crew-' + g).value = boat.pricing[g].crewPrice;
          });
          delWrap.style.display = state.boats.length > 1 ? 'block' : 'none';
        } else {
          const refPricing = getActiveBoat().pricing;
          document.getElementById('ship-form-title').textContent = 'إضافة سفينة جديدة';
          document.getElementById('ship-form-id').value = '';
          document.getElementById('ship-form-name').value = '';
          document.getElementById('ship-form-captain').value = '';

          sailorInputs.forEach((inp, i) => {
            inp.value = 'بحار ' + (i + 1);
          });
          GRADES.forEach(g => {
            document.getElementById('ship-form-crew-' + g).value = refPricing[g].crewPrice;
          });
          delWrap.style.display = 'none';
        }

        openModal('modal-ship-form');
      }

      function submitShipForm(e) {
        e.preventDefault();
        const id = document.getElementById('ship-form-id').value.trim();
        const name = document.getElementById('ship-form-name').value.trim();
        const captain = document.getElementById('ship-form-captain').value.trim();
        const sailorInputs = Array.from(document.querySelectorAll('.ship-sailor-name'));
        const names = sailorInputs.map((inp, i) => inp.value.trim() || ('بحار ' + (i + 1)));

        const crewPrices = {};
        GRADES.forEach(g => {
          crewPrices[g] = Math.max(0, numVal(document.getElementById('ship-form-crew-' + g).value));
        });

        if (!name || !captain) {
          switchShipModalSubTab('info');
          showToast('الرجاء إدخال اسم السفينة والربان', 'error');
          return;
        }

        if (id) {
          const boat = state.boats.find(b => b.id === id);
          if (!boat) return;
          boat.name = name;
          boat.captain = captain;
          boat.sailors.forEach((s, i) => { s.name = names[i]; });
          GRADES.forEach(g => { boat.pricing[g].crewPrice = crewPrices[g]; });

          persistState(true, 'تحديث بيانات وأسعار سفينة ' + name);
          showToast('تم حفظ بيانات السفينة وأسعار البحارة', 'success');
        } else {
          const refPricing = getActiveBoat().pricing;
          const newPricing = {};
          GRADES.forEach(g => {
            newPricing[g] = { sellPrice: refPricing[g].sellPrice, crewPrice: crewPrices[g] };
          });

          const newBoat = {
            id: 'ship-' + Date.now(),
            name: name,
            captain: captain,
            todayDate: getTodayISO(),
            pricing: newPricing,
            boatProduction: createEmptyProduction(),
            sailors: names.map((nm, i) => ({
              id: i + 1,
              name: nm,
              production: createEmptyProduction(),
              debt: 0,
              autoDeduct: true,
              manualDeduction: 0
            })),
            purchases: [],
            managerProduction: [],
            managerExpenses: []
          };

          state.boats.push(newBoat);
          state.activeBoatId = newBoat.id;
          boatsPage = Math.ceil(state.boats.length / 3);
          persistState(true, 'إضافة سفينة جديدة: ' + name);
          showToast('تمت إضافة السفينة بنجاح', 'success');
        }

        closeModal('modal-ship-form');
        renderHeaderShipSelect();
        renderActiveTab();
      }

      function copyTextSafely(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) return true;
        } catch (e) { /* متابعة للبديل */ }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
          return true;
        }
        return false;
      }

      function copyReportSummary() {
        if (!currentReportText) return;
        copyTextSafely(currentReportText);
        showToast('تم نسخ ملخص التصفية لواتساب', 'success');

      /* ========================================================================
         16. محرك المزامنة التلقائية والعمل بدون إنترنت وتبويب «تثبيت وتنزيل»
         ======================================================================== */
      function updateHeaderSyncBadge() {
        const btn = document.getElementById('hdr-sync-btn');
        const txt = document.getElementById('hdr-sync-text');
        if (!btn || !txt) return;

        const online = navigator.onLine;
        const pending = state.sync.pendingChangesCount || 0;
        const hasUrl = Boolean((state.sync.syncUrl || '').trim());

        btn.classList.remove('badge-green', 'badge-amber', 'badge-gray');

        if (isSyncing) {
          btn.classList.add('badge-amber');
          txt.textContent = 'مزامنة...';
          return;
        }
        if (!online) {
          btn.classList.add('badge-gray');
          txt.textContent = pending > 0 ? ('أوفلاين (' + pending + ')') : 'أوفلاين';
          return;
        }
        if (hasUrl && pending > 0) {
          btn.classList.add('badge-amber');
          txt.textContent = 'انتظار (' + pending + ')';
        } else {
          btn.classList.add('badge-green');
          txt.textContent = hasUrl ? 'متزامن' : 'حفظ محلي';
        }
      }

      function scheduleAutoSync() {
        if (!state.sync || !state.sync.autoSync) return;
        if (!navigator.onLine) return;
        if (!(state.sync.syncUrl || '').trim()) return;

        if (autoSyncTimer) clearTimeout(autoSyncTimer);
        autoSyncTimer = setTimeout(() => {
          triggerAutoSyncIfReady();
        }, 1500);
      }

      function triggerAutoSyncIfReady() {
        if (isSyncing) return;
        if (!navigator.onLine) return;
        if (!state.sync || !state.sync.autoSync) return;
        if (!(state.sync.syncUrl || '').trim()) return;
        if ((state.sync.pendingChangesCount || 0) <= 0) return;
        performCloudSync(true);
      }

      async function performCloudSync(isSilent) {
        const url = (state.sync.syncUrl || '').trim();
        if (!url) {
          if (!isSilent) showToast('أدخل رابط Webhook أو استخدم النسخ الاحتياطي', 'info');
          return;
        }
        if (!navigator.onLine) {
          if (!isSilent) showToast('الجهاز غير متصل — البيانات محفوظة محلياً', 'info');
          updateHeaderSyncBadge();
          return;
        }
        if (isSyncing) return;

        isSyncing = true;
        updateHeaderSyncBadge();

        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8'
                     },
            body: JSON.stringify({
              app: 'fishing-fleet-manager',
              syncedAt: new Date().toISOString(),
              data: state
            })
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);

          state.sync.pendingChangesCount = 0;
          state.sync.lastSyncedAt = getTimeStampLabel();
          pushSyncLog(isSilent ? 'مزامنة تلقائية سحابية ناجحة' : 'مزامنة يدوية سحابية ناجحة');
          saveToLocalStorage();
          if (!isSilent) showToast('تمت المزامنة السحابية بنجاح', 'success');
        } catch (err) {
          pushSyncLog('تعذر الوصول للخادم: حفظ محلي آمن');
          saveToLocalStorage();
          if (!isSilent) showToast('تعذر الاتصال بالخادم — البيانات محفوظة محلياً', 'error');
        } finally {
          isSyncing = false;
          updateHeaderSyncBadge();
          if (document.getElementById('modal-sync').classList.contains('open')) {
            renderSyncModalBody();
          }
        }
      }

      function openSyncModal(initialSubTab) {
        syncModalSubTab = initialSubTab || 'cloud';
        renderSyncModalBody();
        openModal('modal-sync');
      }

      function switchSyncSubTab(sub) {
        syncModalSubTab = sub;
        renderSyncModalBody();
      }

      function renderSyncModalBody() {
        const body = document.getElementById('sync-modal-body');
        if (!body) return;
        const online = navigator.onLine;
        const pending = state.sync.pendingChangesCount || 0;

        const subTabBar = `
          <div class="subtab-bar cols-3">
            <button type="button" class="subtab-btn ${syncModalSubTab === 'cloud' ? 'active' : ''}" onclick="switchSyncSubTab('cloud')">المزامنة التلقائية</button>
            <button type="button" class="subtab-btn ${syncModalSubTab === 'backup' ? 'active' : ''}" onclick="switchSyncSubTab('backup')">النسخ الاحتياطي</button>
            <button type="button" class="subtab-btn ${syncModalSubTab === 'install' ? 'active' : ''}" onclick="switchSyncSubTab('install')">تثبيت وتنزيل</button>
          </div>
        `;

        let innerHTML = '';
        if (syncModalSubTab === 'cloud') {
          const logsHTML = (state.sync.logs || []).slice(0, 3).map(l =>
            '<div style="font-size:10.5px;padding:3px 0;border-bottom:1px solid #f1f5f9;" class="flex-between"><span>' + escHTML(l.msg) + '</span><span style="color:#94a3b8;" dir="ltr">' + escHTML(l.time) + '</span></div>'
          ).join('');

          innerHTML = `
            <div class="stack-sm">

      function importBackupJSON(event) {
        const file = event.target.files && event.target.files[0];

        const reader = new FileReader();
        reader.onload = function (ev) {

  function buildSlimData(d) {
    return {
      currency: d.currency || 'أوقية',
      activeBoatId: d.activeBoatId,
      boats: (d.boats || []).map(b => ({
        id: b.id, name: b.name, captain: b.captain, todayDate: b.todayDate,
        pricing: b.pricing, boatProduction: b.boatProduction,
        sailors: b.sailors, purchases: b.purchases,
        managerProduction: b.managerProduction, managerExpenses: b.managerExpenses
      })),
      history: (d.history || []).slice(0, 10)
    };
  }

  function parseAIResponse(rawText) {
    const txt = (rawText || '').trim();
    const match = txt.match(/\{[\s\S]*\}/);
    if (match) {
      try {
        const obj = JSON.parse(match[0]);
        if (obj && (obj.type === 'answer' || obj.type === 'action')) return obj;
      } catch (e) {}
    }
    return { type: 'answer', reply: txt.replace(/[*#`]/g, '') };
  }

  function showConfirmCard(parsed) {
    const card = document.createElement('div');
    card.className = 'fai-card';
    card.innerHTML = `
      <h4>تأكيد العملية قبل الحفظ</h4>
      <div>${parsed.summary || parsed.reply || ''}</div>
      <div class="fai-card-btns">
        <button class="fai-btn-ok">✅ تأكيد وحفظ</button>
        <button class="fai-btn-no">إلغاء</button>
      </div>
    `;
    msgsEl.appendChild(card);
    msgsEl.scrollTop = msgsEl.scrollHeight;

    card.querySelector('.fai-btn-no').onclick = () => {
      card.remove();
      addMsg('تم إلغاء العملية.', 'ai');
    };
    card.querySelector('.fai-btn-ok').onclick = async () => {
      card.querySelector('.fai-btn-ok').disabled = true;
      card.querySelector('.fai-btn-ok').textContent = 'جارٍ الحفظ...';
      const ok = await applyFleetAction(parsed.action, parsed.summary);
      if (ok) {
        speakText('تم الحفظ بنجاح');
        setTimeout(() => location.reload(), 500);
      } else {
        card.remove();
        addMsg('تعذر تطبيق العملية، تأكد من اسم السفينة أو البحار.', 'ai');
      }
    };
  }

  async function applyFleetAction(act, summary) {
    const store = findFleetStore();
    if (!store || !act) return false;
    const d = store.data;
    const boat = d.boats.find(b => b.id === act.boatId)
      || d.boats.find(b => b.name === act.boatName)
      || d.boats.find(b => b.id === d.activeBoatId)
      || d.boats[0];
    if (!boat) return false;

    const today = boat.todayDate || new Date().toISOString().slice(0, 10);
    const grade = ['F', 'R', 'P', 'RR'].includes(act.grade) ? act.grade : 'F';

    if (act.kind === 'sailor_debt') {
      const s = boat.sailors.find(x => String(x.id) === String(act.sailorId))
        || boat.sailors.find(x => act.sailorName && x.name.includes(act.sailorName));
      if (!s) return false;
      const amt = Number(act.amount) || 0;
      if (act.op === 'set') s.debt = Math.max(0, amt);
      else if (act.op === 'sub') s.debt = Math.max(0, (Number(s.debt) || 0) - amt);
      else s.debt = (Number(s.debt) || 0) + amt;
    } else if (act.kind === 'sailor_production') {
      const s = boat.sailors.find(x => String(x.id) === String(act.sailorId))
        || boat.sailors.find(x => act.sailorName && x.name.includes(act.sailorName));
      if (!s) return false;
      const kg = Number(act.kg) || 0;
      s.production = s.production || { F: 0, R: 0, P: 0, RR: 0 };
      s.production[grade] = act.op === 'set' ? kg : (Number(s.production[grade]) || 0) + kg;
    } else if (act.kind === 'boat_production') {
      const kg = Number(act.kg) || 0;
      boat.boatProduction = boat.boatProduction || { F: 0, R: 0, P: 0, RR: 0 };
      boat.boatProduction[grade] = act.op === 'set' ? kg : (Number(boat.boatProduction[grade]) || 0) + kg;
    } else if (act.kind === 'boat_purchase') {
      boat.purchases = boat.purchases || [];
      boat.purchases.unshift({
        id: 'pur-' + Date.now(),
        date: today,
        item: act.item || 'مصروف',
        category: act.category || 'أخرى',
        amount: Number(act.amount) || 0
      });
    } else if (act.kind === 'manager_production') {
      boat.managerProduction = boat.managerProduction || [];
      const unitPrice = (boat.pricing && boat.pricing[grade] && boat.pricing[grade].sellPrice) || 0;
      boat.managerProduction.unshift({
        id: 'mp-' + Date.now(),
        date: today,
        grade: grade,
        kg: Number(act.kg) || 0,
        unitPrice: unitPrice,
        note: act.note || ''
      });
    } else if (act.kind === 'manager_expense') {
      boat.managerExpenses = boat.managerExpenses || [];
      boat.managerExpenses.unshift({
        id: 'me-' + Date.now(),
        date: today,
        item: act.item || act.note || 'مصروف',
        note: act.note || act.item || '',
        category: act.category || 'أخرى',
        amount: Number(act.amount) || 0
      });
    } else {
      return false;
    }

    const now = new Date();
    const stamp = now.toISOString().slice(0, 10) + ' ' + now.toTimeString().slice(0, 5);
    if (d.sync) {
      d.sync.logs = d.sync.logs || [];
      d.sync.logs.unshift({ time: stamp, msg: 'إدخال صوتي: ' + (summary || act.kind) });
      d.sync.logs = d.sync.logs.slice(0, 40);
      d.sync.pendingChangesCount = (d.sync.pendingChangesCount || 0) + 1;
    }

    localStorage.setItem(store.key, JSON.stringify(store.root));

    if (navigator.onLine && d.sync && d.sync.autoSync && d.sync.syncUrl) {
      try {
        await fetch(d.sync.syncUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ app: 'fishing-fleet-manager', syncedAt: now.toISOString(), data: d })
        });
        d.sync.lastSyncedAt = stamp;
        d.sync.pendingChangesCount = 0;
        localStorage.setItem(store.key, JSON.stringify(store.root));
      } catch (e) {}
    }
    return true;
  }

  async function sendQuestion(text) {
    const q = (text || '').trim();
    if (!q) return;
    inputEl.value = '';
    addMsg(q, 'user');

    if (!navigator.onLine) {
      const m = 'المساعد الذكي يحتاج اتصالاً بالإنترنت.';
      addMsg(m, 'ai');
      speakText(m);
      return;
    }

    const store = findFleetStore();
    const syncUrl = store && store.data && store.data.sync && store.data.sync.syncUrl;
    if (!store || !syncUrl) {
      addMsg('لم يتم العثور على رابط المزامنة السحابية داخل إعدادات التطبيق.', 'ai');
      return;
    }

    const waitMsg = addMsg('جارٍ الفهم والتحليل...', 'ai');
    const structuredPrompt =
      'أجب بصيغة JSON صالحة فقط بدون أي نص خارجها وبدون علامات markdown.\n' +
      'إذا كان كلام المستخدم سؤالاً أو استفساراً عن البيانات:\n' +
      '{"type":"answer","reply":"إجابة مختصرة ودقيقة بالعربية مناسبة للنطق الصوتي"}\n' +
      'إذا كان كلام المستخدم طلباً لإضافة أو تعديل قيد (دين/سلفة بحار، تسديد دين، إنتاج بحار، إنتاج سفينة، مصروف/مشتريات سفينة، إنتاج مسير، مصروف مسير):\n' +
      '{"type":"action","summary":"وصف واضح للعملية بالاسم والمبلغ والسفينة","reply":"سأقوم بـ ... اضغط تأكيد للحفظ","action":{"kind":"sailor_debt|sailor_production|boat_production|boat_purchase|manager_production|manager_expense","boatId":"معرّف السفينة من البيانات","boatName":"اسم السفينة","sailorId":0,"sailorName":"اسم البحار","op":"add|sub|set","grade":"F|R|P|RR","kg":0,"amount":0,"item":"وصف المصروف","category":"محروقات|معاش|صيانة|أخرى","note":""}}\n' +
      'ملاحظات: إذا لم تُذكر السفينة فابحث عن البحار في السفن أو استخدم activeBoatId. الأصناف هي F وR وP وRR. العملة أوقية.\n' +
      'طلب المستخدم: ' + q;

    try {
      const res = await fetch(syncUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          action: 'askAI',
          prompt: structuredPrompt,
          fleetData: buildSlimData(store.data)
        })
      });
      const json = await res.json();
      waitMsg.remove();
      const parsed = parseAIResponse(json.reply || '');
      addMsg(parsed.reply || parsed.summary || 'تمت المعالجة.', 'ai');
      speakText(parsed.reply || parsed.summary || '');
      if (parsed.type === 'action' && parsed.action) {
        showConfirmCard(parsed);
      }
    } catch (err) {
      waitMsg.textContent = 'تعذر الاتصال بالمساعد الذكي. تأكد من الإنترنت وحاول مجدداً.';
    }
  }

  function startVoice() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      addMsg('المتصفح لا يدعم التسجيل المباشر؛ يمكنك استخدام زر الميكروفون الموجود في لوحة مفاتيح الهاتف داخل مربع الكتابة.', 'ai');
      return;
    }
    if (isRecording && recognition) {
      recognition.stop();
      return;
    }
    recognition = new SR();
    recognition.lang = 'ar-SA';
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    let finalTxt = '';

    recognition.onstart = () => {
      isRecording = true;
      micBtn.classList.add('rec');
      inputEl.placeholder = 'تحدّث الآن...';
      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
    };
    recognition.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finalTxt += e.results[i][0].transcript;
        else interim += e.results[i][0].transcript;
      }
      inputEl.value = (finalTxt || interim).trim();
    };
    recognition.onerror = () => {
      isRecording = false;
      micBtn.classList.remove('rec');
      inputEl.placeholder = 'تحدث أو اكتب طلبك هنا...';
    };
    recognition.onend = () => {
      isRecording = false;
      micBtn.classList.remove('rec');
      inputEl.placeholder = 'تحدث أو اكتب طلبك هنا...';
      if (inputEl.value.trim()) sendQuestion(inputEl.value);
    };
    recognition.start();
  }

  fab.onclick = () => overlay.classList.add('open');
  document.getElementById('fai-close').onclick = () => {
    overlay.classList.remove('open');
    if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  };
  overlay.onclick = (e) => { if (e.target === overlay) document.getElementById('fai-close').click(); };
  ttsBtn.onclick = () => {
    ttsEnabled = !ttsEnabled;
    ttsBtn.classList.toggle('muted', !ttsEnabled);
    ttsBtn.textContent = ttsEnabled ? '🔊 الصوت' : '🔇 صامت';
    if (!ttsEnabled && 'speechSynthesis' in window) window.speechSynthesis.cancel();
  };
  micBtn.onclick = startVoice;
  sendBtn.onclick = () => sendQuestion(inputEl.value);
  inputEl.onkeydown = (e) => { if (e.key === 'Enter') sendQuestion(inputEl.value); };
  overlay.querySelectorAll('.fai-chip').forEach(btn => {
    btn.onclick = () => sendQuestion(btn.dataset.q);
  });
})();
  </script>
  
</body></html>
