<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f2942" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>إدارة الأسطول — سفن الصيد التقليدي</title>

  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & STRICT ZERO-SCROLL BASE (ZERO EXTERNAL RESOURCES)
       ========================================================================== */
    :root {
      --bg-app: #f1f5f9;
      --bg-card: #ffffff;
      --bg-subtle: #f8fafc;
      --border-card: #e2e8f0;
      --navy-start: #0f2942;
      --navy-end: #163a5f;
      --cyan: #0ea5e9;
      --cyan-dark: #0284c7;
      --cyan-soft: #e0f2fe;
      --emerald: #10b981;
      --emerald-dark: #059669;
      --emerald-soft: #d1fae5;
      --amber: #f59e0b;
      --amber-dark: #b45309;
      --amber-soft: #fef3c7;
      --red: #ef4444;
      --red-dark: #dc2626;
      --red-soft: #fee2e2;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-sm: 8px;
      --shadow-card: 0 2px 8px rgba(15, 41, 66, 0.06);
      --shadow-hero: 0 8px 18px -6px rgba(15, 41, 66, 0.34);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100dvh;
      max-height: 100dvh;
      width: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background-color: #cbd5e1;
      color: var(--text-main);
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, Arial, sans-serif;
      font-size: 13px;
      line-height: 1.35;
    }

    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    /* ==========================================================================
       2. FIXED APP SHELL (ZERO VERTICAL SCROLLING)
       ========================================================================== */
    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-height: 100dvh;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      background-color: var(--bg-app);
      overflow: hidden;
      position: relative;
      box-shadow: 0 0 36px rgba(15, 23, 42, 0.18);
    }

    @media (min-width: 561px) {
      body {
        padding: 8px 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .app-shell {
        height: calc(100dvh - 16px);
        max-height: calc(100dvh - 16px);
        border-radius: 22px;
        border: 1px solid #94a3b8;
      }
    }

    /* Compact Fixed Top Header (~48px) */
    .app-header {
      height: 48px;
      min-height: 48px;
      background: linear-gradient(135deg, var(--navy-start) 0%, var(--navy-end) 100%);
      color: #ffffff;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(15, 41, 66, 0.22);
      z-index: 20;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      flex: 1;
    }

    .header-logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .header-title {
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .header-ship-select {
      background-color: rgba(14, 165, 233, 0.22);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #e0f2fe;
      border-radius: 999px;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: 800;
      outline: none;
      cursor: pointer;
      min-width: 0;
      max-width: 118px;
      text-overflow: ellipsis;
    }
    .header-ship-select option {
      background-color: var(--navy-start);
      color: #ffffff;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }

    .hdr-quick-btn {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.28);
      color: #ffffff;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      white-space: nowrap;
    }
    .hdr-quick-btn:active { transform: scale(0.95); }

    /* Sync Badge */
    .sync-badge-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      cursor: pointer;
      border: 1px solid transparent;
      max-width: 122px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sync-badge-btn:active { transform: scale(0.95); }
    .sync-badge-btn.badge-green {
      background: rgba(16, 185, 129, 0.22);
      border-color: rgba(52, 211, 153, 0.5);
      color: #d1fae5;
    }
    .sync-badge-btn.badge-amber {
      background: rgba(245, 158, 11, 0.22);
      border-color: rgba(251, 191, 36, 0.55);
      color: #fef3c7;
    }
    .sync-badge-btn.badge-gray {
      background: rgba(148, 163, 184, 0.22);
      border-color: rgba(203, 213, 225, 0.45);
      color: #e2e8f0;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .badge-green .status-dot { background-color: #34d399; }
    .badge-amber .status-dot {
      background-color: #fbbf24;
      animation: pulseDot 1.1s infinite ease-in-out;
    }
    .badge-gray .status-dot { background-color: #94a3b8; }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.65; }
    }

    /* Main Content Container (STRICTLY NO VERTICAL SCROLL) */
    .app-main {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 8px;
    }

    .tab-view {
      display: none;
    }
    .tab-view.active {
      height: 100%;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      gap: 6px;
    }

    /* Compact Fixed Bottom Navigation Bar (~60px, 7 Tabs) */
    .bottom-nav {
      height: 60px;
      min-height: 60px;
      background-color: #ffffff;
      border-top: 1px solid var(--border-card);
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      padding: 4px 3px calc(4px + env(safe-area-inset-bottom, 0px));
      gap: 2px;
      flex-shrink: 0;
      box-shadow: 0 -3px 12px rgba(15, 41, 66, 0.08);
      z-index: 25;
    }

    .nav-tab-btn {
      background: transparent;
      border: none;
      border-radius: 10px;
      padding: 3px 1px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      cursor: pointer;
      color: var(--text-muted);
      position: relative;
      transition: background-color 0.14s, transform 0.1s;
    }
    .nav-tab-btn:active { transform: scale(0.94); }
    .nav-tab-btn.active {
      background-color: var(--cyan-soft);
      color: var(--navy-start);
    }
    .nav-tab-btn.active::before {
      content: "";
      position: absolute;
      top: 0;
      left: 20%;
      right: 20%;
      height: 3px;
      border-radius: 0 0 4px 4px;
      background-color: var(--cyan);
    }

    .nav-icon-wrap {
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-label {
      font-size: 9.5px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .nav-tab-btn.active .nav-label {
      font-weight: 900;
      color: var(--navy-start);
    }

    /* ==========================================================================
       3. COMPACT CARDS, GRIDS, TABLES & PAGINATION
       ========================================================================== */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-lg);
      padding: 9px 10px;
      box-shadow: var(--shadow-card);
    }

    .flex-fill-card {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
    }

    .hero-card {
      background: linear-gradient(135deg, var(--navy-start) 0%, var(--navy-end) 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 10px 12px;
      box-shadow: var(--shadow-hero);
      position: relative;
      overflow: hidden;
      flex-shrink: 0;
    }
    .hero-card::after {
      content: "";
      position: absolute;
      left: -24px;
      top: -24px;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: rgba(56, 189, 248, 0.14);
      pointer-events: none;
    }

    .hero-label { font-size: 10.5px; font-weight: 700; color: #bae6fd; }
    .hero-value { font-size: 21px; font-weight: 900; line-height: 1.15; }
    .hero-currency { font-size: 11px; font-weight: 800; color: #38bdf8; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      flex-shrink: 0;
    }

    .kpi-box {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 7px 9px;
      box-shadow: var(--shadow-card);
    }
    .kpi-title { font-size: 10px; font-weight: 700; color: var(--text-muted); }
    .kpi-num { font-size: 14px; font-weight: 900; margin-top: 1px; color: var(--text-main); }
    .kpi-sub { font-size: 9.5px; font-weight: 700; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .text-cyan { color: var(--cyan-dark); }
    .text-emerald { color: var(--emerald-dark); }
    .text-amber { color: var(--amber-dark); }
    .text-red { color: var(--red-dark); }
    .text-navy { color: var(--navy-start); }
    .text-muted { color: var(--text-muted); }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }
    .sec-title { font-size: 13px; font-weight: 900; color: var(--navy-start); }
    .sec-subtitle { font-size: 10px; color: var(--text-muted); font-weight: 600; }

    /* Form Controls */
    .input-field {
      width: 100%;
      background-color: var(--bg-subtle);
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      padding: 6px 8px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
      outline: none;
    }
    .input-field:focus {
      background-color: #ffffff;
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.18);
    }

    .input-compact {
      padding: 5px 3px;
      text-align: center;
      font-size: 12px;
      font-weight: 800;
    }

    .matrix-input {
      width: 100%;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      padding: 4px 2px;
      text-align: center;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-main);
      outline: none;
    }
    .matrix-input:focus {
      background: #ffffff;
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
    }

    .field-label {
      display: block;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      white-space: nowrap;
      transition: transform 0.1s, opacity 0.14s;
    }
    .btn:active { transform: scale(0.96); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-xs { padding: 4px 7px; font-size: 10.5px; border-radius: 7px; }
    .btn-sm { padding: 5px 9px; font-size: 11px; border-radius: 8px; }
    .btn-block { width: 100%; }

    .btn-navy { background: var(--navy-start); color: #ffffff; }
    .btn-cyan { background: var(--cyan-dark); color: #ffffff; }
    .btn-emerald { background: var(--emerald-dark); color: #ffffff; }
    .btn-amber { background: var(--amber-soft); color: var(--amber-dark); border: 1px solid #fcd34d; }
    .btn-red { background: var(--red-soft); color: var(--red-dark); border: 1px solid #fecaca; }
    .btn-ghost { background: #f1f5f9; color: var(--text-main); border: 1px solid #cbd5e1; }
    .btn-light-alpha { background: rgba(255,255,255,0.16); color: #ffffff; border: 1px solid rgba(255,255,255,0.28); }

    /* Sub-Tabs & Selection Pills */
    .subtab-bar {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 4px;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 10px;
      flex-shrink: 0;
    }
    .subtab-bar.cols-3 {
      grid-template-columns: repeat(3, 1fr);
    }
    .subtab-btn {
      border: none;
      background: transparent;
      color: #475569;
      border-radius: 7px;
      padding: 6px 4px;
      font-size: 11.5px;
      font-weight: 800;
      cursor: pointer;
    }
    .subtab-btn.active {
      background: #ffffff;
      color: var(--navy-start);
      box-shadow: 0 1px 4px rgba(15, 23, 42, 0.12);
    }

    .pill-row {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }
    .sel-pill {
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: var(--text-main);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 10.5px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    .sel-pill.active {
      background: var(--navy-start);
      color: #ffffff;
      border-color: var(--cyan);
    }

    /* Grade & Category Badges */
    .grade-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10.5px;
      font-weight: 900;
      padding: 2px 6px;
      border-radius: 5px;
    }
    .grade-F  { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .grade-R  { background: #e0f2fe; color: #075985; border: 1px solid #bae6fd; }
    .grade-P  { background: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
    .grade-RR { background: #ede9fe; color: #5b21b6; border: 1px solid #ddd6fe; }

    .cat-badge {
      display: inline-block;
      font-size: 9.5px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .cat-fuel  { background: var(--red-soft); color: var(--red-dark); }
    .cat-food  { background: var(--amber-soft); color: var(--amber-dark); }
    .cat-ice   { background: var(--cyan-soft); color: #0369a1; }
    .cat-maint { background: #ede9fe; color: #5b21b6; }
    .cat-pers  { background: #dcfce7; color: #166534; }
    .cat-other { background: #e2e8f0; color: #334155; }

    /* Pagination Bar */
    .pager-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding-top: 6px;
      border-top: 1px solid #f1f5f9;
      flex-shrink: 0;
    }
    .pager-info {
      font-size: 10.5px;
      font-weight: 800;
      color: var(--text-muted);
    }

    /* Tables */
    .table-wrap {
      overflow-x: auto;
      overflow-y: hidden;
      flex: 1;
      min-height: 0;
    }
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 11px;
      text-align: right;
    }
    table.data-table th {
      background-color: var(--bg-subtle);
      color: var(--text-muted);
      font-weight: 800;
      padding: 6px 5px;
      border-bottom: 1px solid var(--border-card);
      font-size: 10px;
      white-space: nowrap;
    }
    table.data-table td {
      padding: 6px 5px;
      border-bottom: 1px solid #f1f5f9;
      font-weight: 700;
    }
    table.data-table tr.clickable-row { cursor: pointer; }
    table.data-table tr.active-row { background-color: var(--cyan-soft); }

    /* Production Matrix Table (7 rows fit cleanly without scroll) */
    table.matrix-table {
      width: 100%;
      height: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    table.matrix-table th {
      background: #f8fafc;
      padding: 5px 2px;
      font-size: 10px;
      font-weight: 900;
      text-align: center;
      border-bottom: 1px solid #e2e8f0;
    }
    table.matrix-table td {
      padding: 3px 2px;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
    }
    table.matrix-table tr.vessel-own-row {
      background: #f0f9ff;
    }

    /* 2x3 Sailors Grid */
    .sailors-grid-2x3 {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 6px;
      overflow: hidden;
    }
    .sailor-card-btn {
      background: #ffffff;
      border: 1px solid var(--border-card);
      border-radius: 12px;
      padding: 7px 9px;
      box-shadow: var(--shadow-card);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: right;
      cursor: pointer;
      overflow: hidden;
      transition: border-color 0.14s, transform 0.1s;
    }
    .sailor-card-btn:active {
      transform: scale(0.97);
      border-color: var(--cyan);
    }

    /* 4-Row Pricing Grid */
    .pricing-grid-4 {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-rows: repeat(4, 1fr);
      gap: 6px;
      overflow: hidden;
    }

    /* Grid Helpers */
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .flex-between { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .stack-xs > * + * { margin-top: 5px; }
    .stack-sm > * + * { margin-top: 7px; }

    .toggle-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 11px;
      font-weight: 800;
      color: var(--navy-start);
    }
    .toggle-pill input {
      accent-color: var(--cyan-dark);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    /* List Items Container (Paginated, No Scroll) */
    .paged-items-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
      overflow: hidden;
    }

    .list-row-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 6px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
    }

    /* ==========================================================================
       4. MODALS (NO VERTICAL SCROLL, MAX-HEIGHT 92DVH, NO X / ✕ ICONS)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      backdrop-filter: blur(2px);
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .modal-backdrop.open {
      display: flex;
    }

    .modal-sheet {
      background: #ffffff;
      width: 100%;
      max-width: 490px;
      max-height: 92dvh;
      border-radius: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 22px 44px -10px rgba(0, 0, 0, 0.35);
    }

    .modal-head {
      padding: 10px 14px;
      background: linear-gradient(135deg, var(--navy-start), var(--navy-end));
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-shrink: 0;
    }
    .modal-head h3 {
      font-size: 13.5px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .modal-body {
      padding: 10px 12px;
      overflow: hidden;
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
    }

    /* Toast Notifications */
    .toast-box {
      position: fixed;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 440px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 5px;
      pointer-events: none;
    }
    .toast-item {
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
      transition: opacity 0.25s, transform 0.25s;
    }
    .toast-success { background: var(--emerald-dark); }
    .toast-error   { background: var(--red-dark); }
    .toast-info    { background: var(--navy-start); }

    /* Dedicated Hidden Print Sheet */
    #print-only-sheet {
      display: none;
    }

    @media print {
      html, body {
        height: auto !important;
        max-height: none !important;
        overflow: visible !important;
        background: #ffffff !important;
      }
      body > * {
        display: none !important;
      }
      #print-only-sheet {
        display: block !important;
        width: 100% !important;
        padding: 14px !important;
        color: #0f172a !important;
        background: #ffffff !important;
      }
    }
  </style>

        P:  { label: 'P',  desc: 'ثانية',  cls: 'grade-P' },
        RR: { label: 'RR', desc: 'ثالثة',  cls: 'grade-RR' }
      };

      function getTodayISO() {
        const d = new Date();
        const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
        return local.toISOString().split('T')[0];
      }

      function getTimeStampLabel() {
        const d = new Date();
        const t = d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
        return getTodayISO() + ' ' + t;
      }

      function createDefaultPricing() {
        return {
          F:  { sellPrice: 3200, crewPrice: 1800 },
          R:  { sellPrice: 2600, crewPrice: 1400 },
          P:  { sellPrice: 1900, crewPrice: 1000 },
          RR: { sellPrice: 1200, crewPrice: 600 }
        };
      }

      function createEmptyProduction() {
        return { F: 0, R: 0, P: 0, RR: 0 };
      }

      function createDefaultState() {
        const today = getTodayISO();
        return {
          version: 4,
          currency: 'أوقية',
          activeTab: 'home',
          activeBoatId: 'ship-ahmad-hamad',
          boats: [
            {

      function normalizeBoat(rawBoat) {
        const defPricing = createDefaultPricing();
        const pricing = {};
        GRADES.forEach(g => {
          const src = rawBoat && rawBoat.pricing && rawBoat.pricing[g] ? rawBoat.pricing[g] : defPricing[g];
          pricing[g] = {
            sellPrice: Math.max(0, Number(src.sellPrice) || 0),
            crewPrice: Math.max(0, Number(src.crewPrice) || 0)
          };
        });

        const boatProd = {};
        GRADES.forEach(g => {
          boatProd[g] = Math.max(0, Number(rawBoat && rawBoat.boatProduction && rawBoat.boatProduction[g]) || 0);
        });

        const rawSailors = Array.isArray(rawBoat && rawBoat.sailors) ? rawBoat.sailors : [];
        const sailors = [];
        for (let i = 0; i < 6; i++) {
          const rs = rawSailors[i] || {};
          const sProd = {};
          GRADES.forEach(g => {
            sProd[g] = Math.max(0, Number(rs.production && rs.production[g]) || 0);
          });
          sailors.push({
            id: i + 1,
            name: String(rs.name || ('بحار ' + (i + 1))),
            production: sProd,
            debt: Math.max(0, Number(rs.debt) || 0),
            autoDeduct: rs.autoDeduct !== false,
            manualDeduction: Math.max(0, Number(rs.manualDeduction) || 0)
          });
        }

        const purchases = Array.isArray(rawBoat && rawBoat.purchases)
          ? rawBoat.purchases.map(p => ({
              id: String(p.id || ('pur-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6))),
              date: String(p.date || getTodayISO()),
              item: String(p.item || 'مصروف'),
              category: PURCHASE_CATEGORIES.includes(p.category) ? p.category : 'أخرى',
              amount: Math.max(0, Number(p.amount) || 0)
            }))
          : [];

        const managerProduction = Array.isArray(rawBoat && rawBoat.managerProduction)
          ? rawBoat.managerProduction.map(mp => ({
              id: String(mp.id || ('mp-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6))),
              date: String(mp.date || getTodayISO()),
              grade: GRADES.includes(mp.grade) ? mp.grade : 'F',
              kg: Math.max(0, Number(mp.kg) || 0),
              unitPrice: Math.max(0, Number(mp.unitPrice) || 0),
              note: String(mp.note || '')
            }))
          : [];

        const managerExpenses = Array.isArray(rawBoat && rawBoat.managerExpenses)
          ? rawBoat.managerExpenses.map(me => {
              const cat = me.category === 'مصروف شخصي' ? 'شخصي' : me.category;
              return {
                id: String(me.id || ('me-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6))),
                date: String(me.date || getTodayISO()),
                item: String(me.item || 'مصروف مسير'),
                category: MGR_EXPENSE_CATEGORIES.includes(cat) ? cat : 'أخرى',
                amount: Math.max(0, Number(me.amount) || 0)
              };
            })
          : [];

        return {
          id: String((rawBoat && rawBoat.id) || ('ship-' + Date.now())),
          name: String((rawBoat && rawBoat.name) || 'سفينة'),
          captain: String((rawBoat && rawBoat.captain) || 'الربان'),
          todayDate: String((rawBoat && rawBoat.todayDate) || getTodayISO()),
          pricing: pricing,
          boatProduction: boatProd,
          sailors: sailors,
          purchases: purchases,
          managerProduction: managerProduction,
          managerExpenses: managerExpenses
        };
      }

      function normalizeState(raw) {
        const def = createDefaultState();
        if (!raw || typeof raw !== 'object' || !Array.isArray(raw.boats) || raw.boats.length === 0) {
          return def;
        }
        const boats = raw.boats.map(normalizeBoat);
        const validTabs = ['home', 'production', 'sailors', 'purchases', 'manager', 'pricing', 'boats'];
        const activeTab = validTabs.includes(raw.activeTab) ? raw.activeTab : 'home';
        const activeBoatId = boats.some(b => b.id === raw.activeBoatId) ? raw.activeBoatId : boats[0].id;

        const sync = Object.assign({}, def.sync, raw.sync || {});
        if (!Array.isArray(sync.logs)) sync.logs = def.sync.logs;
        sync.autoSync = sync.autoSync !== false;

        return {
          version: 4,
          currency: String(raw.currency || 'أوقية'),
          activeTab: activeTab,
          activeBoatId: activeBoatId,
          boats: boats,
          history: Array.isArray(raw.history) ? raw.history : [],
          sync: sync
        };
      }

      function loadState() {
        try {
          let raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            for (let i = 0; i < FALLBACK_KEYS.length; i++) {
              const candidate = localStorage.getItem(FALLBACK_KEYS[i]);
              if (candidate) {
                raw = candidate;
                break;
              }
            }
          }
          if (!raw) {
            for (let i = 0; i < localStorage.length; i++) {
              const k = localStorage.key(i);
              if (k && k.indexOf('fishing_fleet') === 0) {
                const candidate = localStorage.getItem(k);
                if (candidate) {
                  raw = candidate;
                  break;
                }
              }
            }
          }
          if (!raw) return createDefaultState();
          return normalizeState(JSON.parse(raw));
        } catch (e) {
          return createDefaultState();
        }
      }

      function saveToLocalStorage() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

        if (state.sync.logs.length > 20) state.sync.logs.length = 20;

        if (isDataChange) {

          if (logMessage) pushSyncLog(logMessage);
        }
        saveToLocalStorage();

      /* ========================================================================

      const intFmt = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
      const decFmt = new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });

      function fmtMoney(val) {
        const n = Number(val);
        return intFmt.format(Number.isFinite(n) ? Math.round(n) : 0);
      }

      function fmtNum(val) {
        const n = Number(val);
        return decFmt.format(Number.isFinite(n) ? n : 0);
      }

      function numVal(v) {
        const n = parseFloat(v);
        return Number.isFinite(n) ? n : 0;
      }

      function escHTML(str) {
        return String(str == null ? '' : str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')

      function paginateArray(arr, page, perPage) {
        const total = arr.length;
        const totalPages = Math.max(1, Math.ceil(total / perPage));
        const safePage = Math.min(Math.max(1, page), totalPages);
        const start = (safePage - 1) * perPage;
        return {
          items: arr.slice(start, start + perPage),
          page: safePage,
          totalPages: totalPages,
          total: total
        };
      }

      function renderPagerHTML(page, totalPages, totalItems, prevCall, nextCall) {
        if (totalPages <= 1 && totalItems <= 0) return '';
        return `
          <div class="pager-bar">
            <button type="button" class="btn btn-xs btn-ghost" ${page <= 1 ? 'disabled' : ''} onclick="${prevCall}">السابق</button>
            <span class="pager-info">صفحة <span dir="ltr">${page} / ${totalPages}</span> (<span dir="ltr">${totalItems}</span>)</span>
            <button type="button" class="btn btn-xs btn-ghost" ${page >= totalPages ? 'disabled' : ''} onclick="${nextCall}">التالي</button>
          </div>
        `;
      }

      /* ========================================================================
         4. FINANCIAL CALCULATIONS
         ======================================================================== */
      function calcSailorMetrics(sailor, pricing) {
        let kg = 0;
        let salesVal = 0;
        let grossShare = 0;

        GRADES.forEach(g => {
          const qty = Math.max(0, numVal(sailor.production[g]));
          const sellP = Math.max(0, numVal(pricing[g].sellPrice));
          const crewP = Math.max(0, numVal(pricing[g].crewPrice));
          kg += qty;
          salesVal += qty * sellP;
          grossShare += qty * crewP;
        });

        const debt = Math.max(0, numVal(sailor.debt));
        let deduction = 0;
        if (sailor.autoDeduct) {
          deduction = Math.min(debt, grossShare);
        } else {
          const manual = Math.max(0, numVal(sailor.manualDeduction));
          deduction = Math.min(debt, Math.min(grossShare, manual));
        }

        const netPayable = Math.max(0, grossShare - deduction);
        const remainingDebt = Math.max(0, debt - deduction);

        return {
          name: sailor.name,
          kg: kg,
          salesVal: salesVal,
          grossShare: grossShare,
          debt: debt,
          deduction: deduction,
          netPayable: netPayable,
          remainingDebt: remainingDebt
        };
      }

      function calcBoatMetrics(boat) {
        let vesselProdKg = 0;
        let vesselSalesVal = 0;
        const vesselByGrade = {};

        GRADES.forEach(g => {
          const qty = Math.max(0, numVal(boat.boatProduction[g]));
          const sellP = Math.max(0, numVal(boat.pricing[g].sellPrice));
          const val = qty * sellP;
          vesselProdKg += qty;
          vesselSalesVal += val;
          vesselByGrade[g] = { kg: qty, val: val };
        });

        let sailorsProdKg = 0;
        let sailorsSalesVal = 0;
        let totalSailorsShare = 0;
        let totalDebt = 0;
        let totalDebtDeducted = 0;
        let totalNetPaidToSailors = 0;

        const sailorMetrics = boat.sailors.map(s => {
          const sm = calcSailorMetrics(s, boat.pricing);
          sailorsProdKg += sm.kg;
          sailorsSalesVal += sm.salesVal;
          totalSailorsShare += sm.grossShare;
          totalDebt += sm.debt;
          totalDebtDeducted += sm.deduction;
          totalNetPaidToSailors += sm.netPayable;
          return sm;
        });

        let totalPurchases = 0;
        let fuelTotal = 0;
        let otherExpensesTotal = 0;
        const purchasesByCat = {};
        PURCHASE_CATEGORIES.forEach(c => { purchasesByCat[c] = 0; });

        boat.purchases.forEach(p => {
          const amt = Math.max(0, numVal(p.amount));
          totalPurchases += amt;
          const cat = PURCHASE_CATEGORIES.includes(p.category) ? p.category : 'أخرى';
          purchasesByCat[cat] += amt;
          if (cat === 'محروقات') fuelTotal += amt;
          else otherExpensesTotal += amt;
        });

        const totalProductionKg = vesselProdKg + sailorsProdKg;
        const totalSalesValue = vesselSalesVal + sailorsSalesVal;
        const netVesselProfit = totalSalesValue - totalSailorsShare - totalPurchases;

        return {
          vesselProdKg: vesselProdKg,
          vesselSalesVal: vesselSalesVal,
          vesselByGrade: vesselByGrade,
          sailorsProdKg: sailorsProdKg,
          sailorsSalesVal: sailorsSalesVal,
          totalSailorsShare: totalSailorsShare,
          totalDebt: totalDebt,
          totalDebtDeducted: totalDebtDeducted,
          totalNetPaidToSailors: totalNetPaidToSailors,
          totalPurchases: totalPurchases,
          fuelTotal: fuelTotal,
          otherExpensesTotal: otherExpensesTotal,
          purchasesByCat: purchasesByCat,
          totalProductionKg: totalProductionKg,
          totalSalesValue: totalSalesValue,
          netVesselProfit: netVesselProfit,
          sailorMetrics: sailorMetrics
        };
      }

      function calcFleetMetrics() {
        let totalKg = 0;
        let totalSales = 0;
        let totalSailorsShare = 0;
        let totalDebt = 0;
        let totalPurchases = 0;
        let netFleetProfit = 0;

        const perBoat = state.boats.map(b => {
          const m = calcBoatMetrics(b);
          totalKg += m.totalProductionKg;
          totalSales += m.totalSalesValue;
          totalSailorsShare += m.totalSailorsShare;
          totalDebt += m.totalDebt;
          totalPurchases += m.totalPurchases;
          netFleetProfit += m.netVesselProfit;
          return { boat: b, metrics: m };
        });

        return {
          totalKg: totalKg,
          totalSales: totalSales,
          totalSailorsShare: totalSailorsShare,
          totalDebt: totalDebt,
          totalPurchases: totalPurchases,
          netFleetProfit: netFleetProfit,
          perBoat: perBoat
        };
      }

        const el = document.createElement('div');
        el.className = 'toast-item ' + (type === 'error' ? 'toast-error' : (type === 'info' ? 'toast-info' : 'toast-success'));
        el.textContent = msg;
        box.appendChild(el);
        setTimeout(() => {
          el.style.opacity = '0';
          el.style.transform = 'translateY(-6px)';
          setTimeout(() => el.remove(), 250);
        }, 2300);
      }

        const row2 = document.getElementById('confirm-check2-row');
        const chk1 = document.getElementById('confirm-check1');
        const chk2 = document.getElementById('confirm-check2');

        if (opts.check1Label || opts.check2Label) {
          checksWrap.style.display = 'block';
          if (opts.check1Label) {
            row1.style.display = 'inline-flex';
            document.getElementById('confirm-check1-label').textContent = opts.check1Label;
            chk1.checked = opts.check1Default !== false;

          if (opts.check2Label) {
            row2.style.display = 'inline-flex';
            document.getElementById('confirm-check2-label').textContent = opts.check2Label;
            chk2.checked = opts.check2Default !== false;
          } else {
            row2.style.display = 'none';
          }
        } else {
          checksWrap.style.display = 'none';
        }

        confirmCallback = opts.onConfirm || null;
        openModal('modal-confirm');
      }

        };

      function updateCurrencyLabels() {
        document.querySelectorAll('.cur-lbl').forEach(el => {
          el.textContent = state.currency;
        });
      }

      /* ========================================================================
         6. HEADER & NAVIGATION
         ======================================================================== */
      function renderHeaderShipSelect() {
        const sel = document.getElementById('hdr-ship-select');
        if (!sel) return;
        sel.innerHTML = state.boats.map(b =>
          '<option value="' + escHTML(b.id) + '" ' + (b.id === state.activeBoatId ? 'selected' : '') + '>' + escHTML(b.name) + '</option>'
        ).join('');
      }

      function selectBoat(boatId) {
        if (!state.boats.some(b => b.id === boatId)) return;
        state.activeBoatId = boatId;
        purchasesPage = 1;
        mgrProdPage = 1;
        mgrExpPage = 1;
        saveToLocalStorage();
        renderHeaderShipSelect();
        renderActiveTab();
      }

      function switchTab(tabId) {
        const valid = ['home', 'production', 'sailors', 'purchases', 'manager', 'pricing', 'boats'];
        state.activeTab = valid.includes(tabId) ? tabId : 'home';
        saveToLocalStorage();

        document.querySelectorAll('.nav-tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === state.activeTab);
        });
        document.querySelectorAll('.tab-view').forEach(sec => {
          sec.classList.toggle('active', sec.id === 'view-' + state.activeTab);
        });

        renderActiveTab();
      }

      function renderActiveTab() {
        const tab = state.activeTab || 'home';
        document.querySelectorAll('.nav-tab-btn').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        document.querySelectorAll('.tab-view').forEach(sec => {
          sec.classList.toggle('active', sec.id === 'view-' + tab);
        });

        const viewEl = document.getElementById('view-' + tab);
        if (!viewEl) return;

        if (tab === 'home') viewEl.innerHTML = renderHomeTab();
        else if (tab === 'production') viewEl.innerHTML = renderProductionTab();
        else if (tab === 'sailors') viewEl.innerHTML = renderSailorsTab();
        else if (tab === 'purchases') viewEl.innerHTML = renderPurchasesTab();
        else if (tab === 'manager') viewEl.innerHTML = renderManagerTab();
        else if (tab === 'pricing') viewEl.innerHTML = renderPricingTab();
        else if (tab === 'boats') viewEl.innerHTML = renderBoatsTab();
      }

      /* ========================================================================
         7. TAB 1: DASHBOARD (الرئيسية — ZERO SCROLL)
         ======================================================================== */
      function renderHomeTab() {
        const fleet = calcFleetMetrics();
        const activeBoat = getActiveBoat();
        const activeMetrics = calcBoatMetrics(activeBoat);

        const paged = paginateArray(fleet.perBoat, homeFleetPage, 3);

          const isActive = boat.id === activeBoat.id;
          return `
            <tr class="clickable-row ${isActive ? 'active-row' : ''}" onclick="selectBoat('${escHTML(boat.id)}')">

                <div style="font-weight:900;color:#0f2942;">${escHTML(boat.name)}</div>
                <div style="font-size:9.5px;color:#64748b;">${escHTML(boat.captain)}</div>

              <td dir="ltr">${fmtNum(metrics.totalProductionKg)}</td>
              <td dir="ltr" class="text-cyan">${fmtMoney(metrics.totalSalesValue)}</td>

            <div class="flex-between">

                  <span dir="ltr">${fmtMoney(fleet.netFleetProfit)}</span>
                  <span class="hero-currency">${escHTML(state.currency)}</span>
                </div>
              </div>
              <div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end;">
                <button type="button" class="btn btn-xs btn-cyan" onclick="openCurrentSettlementPreview()">كشف التصفية</button>

              </div>
            </div>
            <div style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.14);font-size:10.5px;color:#bae6fd;" class="flex-between">
              <span>السفينة النشطة: <strong style="color:#ffffff;">${escHTML(activeBoat.name)}</strong></span>
              <span>صافي السفينة: <strong style="color:#34d399;" dir="ltr">${fmtMoney(activeMetrics.netVesselProfit)}</strong> ${escHTML(state.currency)}</span>
            </div>
          </div>

          <!-- Compact 2x2 KPI Grid -->
          <div class="kpi-grid">
            <div class="kpi-box">
              <div class="kpi-title">إجمالي الإنتاج (كغ)</div>
              <div class="kpi-num text-cyan" dir="ltr">${fmtNum(fleet.totalKg)}</div>
              <div class="kpi-sub">كيلوغرام</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-title">قيمة البيع</div>
              <div class="kpi-num text-navy" dir="ltr">${fmtMoney(fleet.totalSales)}</div>
              <div class="kpi-sub">${escHTML(state.currency)}</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-title">حصة البحارة</div>
              <div class="kpi-num text-amber" dir="ltr">${fmtMoney(fleet.totalSailorsShare)}</div>
              <div class="kpi-sub">${escHTML(state.currency)}</div>
            </div>
            <div class="kpi-box">
              <div class="kpi-title">ديون البحارة والمشتريات</div>
              <div class="kpi-num text-red" dir="ltr">${fmtMoney(fleet.totalDebt + fleet.totalPurchases)}</div>
              <div class="kpi-sub">ديون <span dir="ltr">${fmtMoney(fleet.totalDebt)}</span> • مشتريات <span dir="ltr">${fmtMoney(fleet.totalPurchases)}</span></div>
            </div>
          </div>

          <!-- Paginated Vessel Performance Table -->
          <div class="card flex-fill-card">
            <div class="sec-head" style="margin-bottom:4px;">
              <div>
                <div class="sec-title">أداء كل سفينة</div>
                <div class="sec-subtitle">اضغط على أي صف لتفعيل السفينة</div>
              </div>
              <span class="cat-badge cat-ice" dir="ltr">${escHTML(activeBoat.todayDate)}</span>

      /* ========================================================================

         ======================================================================== */
      function renderProductionTab() {

        const m = calcBoatMetrics(boat);

        const vesselRowHTML = `
          <tr class="vessel-own-row">

            </td>
            ${GRADES.map(g => `
              <td>
                <input type="number" min="0" step="any" class="matrix-input"

              </td>
              ${GRADES.map(g => `
                <td>
                  <input type="number" min="0" step="any" class="matrix-input"
                    value="${s.production[g] || ''}" placeholder="0"
                    oninput="onMatrixSailorInput(${idx}, '${g}', this.value)" />

              `).join('')}

        return `
          <!-- Top Summary Bar -->
          <div class="hero-card" style="padding:8px 10px;">
            <div class="grid-3" style="text-align:center;align-items:center;">
              <div>
                <div class="hero-label">إنتاج السفينة الخاصة</div>
                <div style="font-size:14px;font-weight:900;color:#38bdf8;"><span id="prod-top-vessel-kg" dir="ltr">${fmtNum(m.vesselProdKg)}</span> كغ</div>
              </div>
              <div style="border-inline:1px solid rgba(255,255,255,0.18);">
                <div class="hero-label">إنتاج البحارة (6)</div>

                <div class="hero-label">إجمالي قيمة البيع</div>
                <div style="font-size:14px;font-weight:900;color:#34d399;" id="prod-top-sales" dir="ltr">${fmtMoney(m.totalSalesValue)}</div>
              </div>
            </div>

          <!-- Compact 7-Row Matrix (Vessel + 6 Sailors) -->
          <div class="card flex-fill-card" style="padding:6px 6px;">
            <div class="flex-between" style="padding:0 4px 4px;">
              <span class="sec-title" style="font-size:12px;">مصفوفة الإنتاج (كغ) — ${escHTML(boat.name)}</span>
              <span style="font-size:10px;font-weight:800;color:#64748b;">الإجمالي: <strong class="text-navy" id="prod-top-total-kg" dir="ltr">${fmtNum(m.totalProductionKg)}</strong> كغ</span>
            </div>
            <div style="flex:1;min-height:0;overflow:hidden;">
              <table class="matrix-table">

                  <col style="width:27%;">
                  <col style="width:15%;">
                  <col style="width:15%;">
                  <col style="width:15%;">
                  <col style="width:15%;">
                  <col style="width:13%;">

                  <tr>
                    <th style="text-align:right;padding-right:4px;">الاسم</th>

                  ${sailorRowsHTML}
                </tbody>
              </table>
            </div>
          </div>
        `;

      function refreshProductionTopTotals(m) {
        const elV = document.getElementById('prod-top-vessel-kg');
        const elS = document.getElementById('prod-top-sailors-kg');
        const elVal = document.getElementById('prod-top-sales');
        const elTot = document.getElementById('prod-top-total-kg');
        if (elV) elV.textContent = fmtNum(m.vesselProdKg);
        if (elS) elS.textContent = fmtNum(m.sailorsProdKg);
        if (elVal) elVal.textContent = fmtMoney(m.totalSalesValue);
        if (elTot) elTot.textContent = fmtNum(m.totalProductionKg);
      }

      function onMatrixVesselInput(grade, rawVal) {
        const boat = getActiveBoat();
        boat.boatProduction[grade] = Math.max(0, numVal(rawVal));
        persistState(true, 'تحديث إنتاج سفينة ' + boat.name + ' (' + grade + ')');
        const m = calcBoatMetrics(boat);
        const cell = document.getElementById('mx-vessel-kg');
        if (cell) cell.textContent = fmtNum(m.vesselProdKg);
        refreshProductionTopTotals(m);
      }

      function onMatrixSailorInput(idx, grade, rawVal) {
        const boat = getActiveBoat();
        if (!boat.sailors[idx]) return;
        boat.sailors[idx].production[grade] = Math.max(0, numVal(rawVal));
        persistState(true, 'تحديث إنتاج ' + boat.sailors[idx].name);
        const m = calcBoatMetrics(boat);
        const cell = document.getElementById('mx-sailor-kg-' + idx);
        if (cell && m.sailorMetrics[idx]) cell.textContent = fmtNum(m.sailorMetrics[idx].kg);
        refreshProductionTopTotals(m);
      }

              <div class="kpi-title">مجموع الديون</div>
              <div class="kpi-num text-red" style="font-size:13px;" dir="ltr">${fmtMoney(m.totalDebt)}</div>

            <div class="kpi-box" style="padding:6px 5px;">
              <div class="kpi-title">الصافي للدفع</div>

          <!-- 2x3 Sailors Grid Filling Remaining Space -->

            ${cardsHTML}
