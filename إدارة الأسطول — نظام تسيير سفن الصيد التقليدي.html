      function onSailorModalNameInput(val) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        s.name = val || ('بحار ' + (activeSailorIdx + 1));
        document.getElementById('sm-title').textContent = (activeSailorIdx + 1) + '. ' + s.name + ' (' + boat.name + ')';
        persistState(true, 'تغيير اسم البحار إلى ' + s.name);
        renderActiveTab();
      }

      function onSailorModalProdInput(grade, rawVal) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        s.production[grade] = Math.max(0, numVal(rawVal));
        persistState(true, 'تحديث إنتاج ' + s.name);
        const sm = calcSailorMetrics(s, boat.pricing);
        const elKg = document.getElementById('sm-tot-kg');
        const elShare = document.getElementById('sm-tot-share');
        if (elKg) elKg.textContent = fmtNum(sm.kg);
        if (elShare) elShare.textContent = fmtMoney(sm.grossShare);
        renderActiveTab();
      }

      function setSailorAdvPreset(amt) {
        const inp = document.getElementById('sm-adv-amount');
        if (inp) inp.value = amt;
      }

      function applySailorModalDebtDelta(sign) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        const inp = document.getElementById('sm-adv-amount');
        const amt = Math.max(0, numVal(inp ? inp.value : 0));
        if (amt <= 0) {
          showToast('الرجاء إدخال مبلغ أكبر من الصفر', 'error');
          return;
        }
        s.debt = Math.max(0, numVal(s.debt) + sign * amt);
        persistState(true, (sign > 0 ? 'سلفة ' : 'سداد ') + fmtMoney(amt) + ' لـ ' + s.name);
        renderSailorModalBody();
        renderActiveTab();
        showToast(sign > 0 ? 'تمت إضافة السلفة بنجاح' : 'تم خصم السداد بنجاح', 'success');
      }

      function onSailorModalDirectDebt(rawVal) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        s.debt = Math.max(0, numVal(rawVal));
        persistState(true, 'تعديل دين ' + s.name);
        const sm = calcSailorMetrics(s, boat.pricing);
        const elD = document.getElementById('sm-debt-disp');
        const elN = document.getElementById('sm-net-disp');
        const elDed = document.getElementById('sm-deduct-disp');
        const elRem = document.getElementById('sm-remdebt-disp');
        if (elD) elD.textContent = fmtMoney(sm.debt);
        if (elN) elN.textContent = fmtMoney(sm.netPayable);
        if (elDed) elDed.textContent = fmtMoney(sm.deduction);
        if (elRem) elRem.textContent = fmtMoney(sm.remainingDebt);
        renderActiveTab();
      }

      function onSailorModalAutoToggle(checked) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        s.autoDeduct = Boolean(checked);
        persistState(true, 'تغيير نمط خصم الدين لـ ' + s.name);
        renderSailorModalBody();
        renderActiveTab();
      }

      function onSailorModalManualDeduct(rawVal) {
        const boat = getActiveBoat();
        const s = boat.sailors[activeSailorIdx];
        if (!s) return;
        s.manualDeduction = Math.max(0, numVal(rawVal));
        persistState(true, 'تعديل الخصم اليدوي لـ ' + s.name);
        const sm = calcSailorMetrics(s, boat.pricing);
        const elN = document.getElementById('sm-net-disp');
        const elRem = document.getElementById('sm-remdebt-disp');
        if (elN) elN.textContent = fmtMoney(sm.netPayable);
        if (elRem) elRem.textContent = fmtMoney(sm.remainingDebt);
        renderActiveTab();
      }

      /* ========================================================================
         10. TAB 4: PURCHASES (المشتريات — PAGINATED 4 ITEMS/PAGE)
         ======================================================================== */
      function getFilteredPurchases(boat) {
        const q = purchaseSearch.trim().toLowerCase();
        return boat.purchases.filter(p => {
          const matchCat = purchaseCatFilter === 'ALL' || p.category === purchaseCatFilter;
          const matchQ = !q || p.item.toLowerCase().includes(q) || p.category.toLowerCase().includes(q);
          return matchCat && matchQ;
        });
      }

      function renderPurchasesTab() {
        const boat = getActiveBoat();
        const m = calcBoatMetrics(boat);
        const filtered = getFilteredPurchases(boat);
        const paged = paginateArray(filtered, purchasesPage, 4);
        purchasesPage = paged.page;

        const catPills = ['ALL'].concat(PURCHASE_CATEGORIES).map(c => `
          <button type="button" class="sel-pill ${purchaseCatFilter === c ? 'active' : ''}" onclick="onPurchaseFilter('${c}')">
            ${c === 'ALL' ? 'الكل' : c}
          </button>
        `).join('');

        return `
          <!-- Top Summary & Add Button -->
          <div class="hero-card" style="padding:9px 11px;">
            <div class="flex-between">
              <div>
                <div class="hero-label">مشتريات ومحروقات — ${escHTML(boat.name)}</div>
                <div style="font-size:18px;font-weight:900;margin-top:1px;" dir="ltr">${fmtMoney(m.totalPurchases)} <span class="hero-currency">${escHTML(state.currency)}</span></div>
              </div>
              <button type="button" class="btn btn-sm btn-cyan" onclick="openPurchaseModal(null)">+ إضافة شراء</button>
            </div>
            <div class="grid-2" style="margin-top:6px;padding-top:6px;border-top:1px solid rgba(255,255,255,0.14);font-size:10.5px;color:#bae6fd;">
              <div>المحروقات: <strong style="color:#fca5a5;" dir="ltr">${fmtMoney(m.fuelTotal)}</strong></div>
              <div>المعاش والمصروفات: <strong style="color:#fde68a;" dir="ltr">${fmtMoney(m.otherExpensesTotal)}</strong></div>
            </div>
          </div>

          <!-- Filter & Search Strip -->
          <div class="card stack-xs" style="flex-shrink:0;padding:7px 9px;">
            <div class="pill-row">${catPills}</div>
            <input type="text" class="input-field" value="${escHTML(purchaseSearch)}" placeholder="بحث في لائحة المشتريات..." oninput="onPurchaseSearch(this.value)" />
          </div>

          <!-- Paginated Purchases List -->
          <div class="card flex-fill-card">
            <div class="paged-items-wrap" id="purchases-paged-list">
              ${renderPurchasesItemsHTML(paged.items)}
            </div>
            <div id="purchases-pager-wrap">
              ${renderPagerHTML(paged.page, paged.totalPages, paged.total, 'changePurchasesPage(-1)', 'changePurchasesPage(1)')}
            </div>
          </div>
        `;
      }

      function renderPurchasesItemsHTML(items) {
        if (items.length === 0) {
          return '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#64748b;font-weight:700;font-size:12px;">لا توجد مشتريات في هذا النطاق.</div>';
        }
        return items.map(p => `
          <div class="list-row-card">
            <div style="min-width:0;">
              <div style="display:flex;align-items:center;gap:5px;">
                <strong style="font-size:12px;color:#0f2942;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;">${escHTML(p.item)}</strong>
                <span class="cat-badge ${getCategoryClass(p.category)}">${escHTML(p.category)}</span>
              </div>
              <div style="font-size:10px;color:#64748b;" dir="ltr">${escHTML(p.date)}</div>
            </div>
            <div style="display:flex;align-items:center;gap:4px;flex-shrink:0;">
              <strong class="text-red" style="font-size:12px;" dir="ltr">${fmtMoney(p.amount)}</strong>
              <button type="button" class="btn btn-xs btn-ghost" onclick="openPurchaseModal('${escHTML(p.id)}')">تعديل</button>
              <button type="button" class="btn btn-xs btn-red" onclick="deletePurchase('${escHTML(p.id)}')">حذف</button>
            </div>
          </div>
        `).join('');
      }

      function onPurchaseSearch(val) {
        purchaseSearch = val;
        purchasesPage = 1;
        const boat = getActiveBoat();
        const filtered = getFilteredPurchases(boat);
        const paged = paginateArray(filtered, purchasesPage, 4);
        const listEl = document.getElementById('purchases-paged-list');
        const pagerEl = document.getElementById('purchases-pager-wrap');
        if (listEl) listEl.innerHTML = renderPurchasesItemsHTML(paged.items);
        if (pagerEl) pagerEl.innerHTML = renderPagerHTML(paged.page, paged.totalPages, paged.total, 'changePurchasesPage(-1)', 'changePurchasesPage(1)');
      }

      function onPurchaseFilter(cat) {
        purchaseCatFilter = cat;
        purchasesPage = 1;
        renderActiveTab();
      }

      function changePurchasesPage(delta) {
        purchasesPage += delta;
        renderActiveTab();
      }

      function openPurchaseModal(purId) {
        const boat = getActiveBoat();
        updateCurrencyLabels();
        if (purId) {
          const p = boat.purchases.find(x => x.id === purId);
          if (!p) return;
          document.getElementById('pm-title').textContent = 'تعديل بند شراء';
          document.getElementById('pm-id').value = p.id;
          document.getElementById('pm-item').value = p.item;
          document.getElementById('pm-cat').value = p.category;
          document.getElementById('pm-amount').value = p.amount;
          document.getElementById('pm-date').value = p.date;
        } else {
          document.getElementById('pm-title').textContent = 'إضافة شراء جديد — ' + boat.name;
          document.getElementById('pm-id').value = '';
          document.getElementById('pm-item').value = '';
          document.getElementById('pm-cat').value = 'محروقات';
          document.getElementById('pm-amount').value = '';
          document.getElementById('pm-date').value = boat.todayDate || getTodayISO();
        }
        openModal('modal-purchase');
      }

      function savePurchaseForm(e) {
        e.preventDefault();
        const boat = getActiveBoat();
        const id = document.getElementById('pm-id').value.trim();
        const item = document.getElementById('pm-item').value.trim();
        const category = document.getElementById('pm-cat').value;
        const amount = Math.max(0, numVal(document.getElementById('pm-amount').value));
        const date = document.getElementById('pm-date').value || boat.todayDate || getTodayISO();

        if (!item || amount <= 0) {
          showToast('الرجاء إدخال البيان ومبلغ أكبر من الصفر', 'error');
          return;
        }

        if (id) {
          const p = boat.purchases.find(x => x.id === id);
          if (p) {
            p.item = item;
            p.category = category;
            p.amount = amount;
            p.date = date;
            persistState(true, 'تعديل شراء (' + boat.name + '): ' + item);
            showToast('تم تحديث البند بنجاح', 'success');
          }
        } else {
          boat.purchases.unshift({
            id: 'pur-' + Date.now(),
            date: date,
            item: item,
            category: category,
            amount: amount
          });
          purchasesPage = 1;
          persistState(true, 'إضافة شراء (' + boat.name + '): ' + item);
          showToast('تمت إضافة الشراء إلى اللائحة', 'success');
        }

        closeModal('modal-purchase');
        renderActiveTab();
      }

      function deletePurchase(purId) {
        const boat = getActiveBoat();
        boat.purchases = boat.purchases.filter(p => p.id !== purId);
        persistState(true, 'حذف بند من مشتريات ' + boat.name);
        renderActiveTab();
        showToast('تم حذف البند', 'info');
      }

      /* ========================================================================
         11. TAB 5: MANAGER (المسير — PRODUCTION & EXPENSE ONLY, ZERO SCROLL)
         ======================================================================== */
      function getMgrDefaultUnitPrice(boat, grade, mode) {
        const p = boat.pricing[grade] || { sellPrice: 0, crewPrice: 0 };
        return mode === 'crew' ? p.crewPrice : p.sellPrice;
      }

      function renderManagerTab() {
        const boat = getActiveBoat();
        const selectedDate = boat.todayDate || getTodayISO();
        const allProd = boat.managerProduction || [];
        const allExp = boat.managerExpenses || [];

        const scopedProd = mgrDateScope === 'selected' ? allProd.filter(x => x.date === selectedDate) : allProd;
        const scopedExp = mgrDateScope === 'selected' ? allExp.filter(x => x.date === selectedDate) : allExp;

        let prodKg = 0;
        let prodVal = 0;
        scopedProd.forEach(mp => {
          const kg = Math.max(0, numVal(mp.kg));
          const pr = Math.max(0, numVal(mp.unitPrice));
          prodKg += kg;
          prodVal += kg * pr;
        });

        let expTotal = 0;
        scopedExp.forEach(me => {
          expTotal += Math.max(0, numVal(me.amount));
        });
        const netMgr = prodVal - expTotal;

        let subBodyHTML = '';
        if (mgrSubTab === 'prod') {
          const pagedProd = paginateArray(scopedProd, mgrProdPage, 3);
          mgrProdPage = pagedProd.page;
          const defaultPrice = getMgrDefaultUnitPrice(boat, mgrSelectedGrade, mgrPriceMode);

          const prodRowsHTML = pagedProd.items.length === 0
            ? '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:11.5px;font-weight:700;">لا يوجد إنتاج مسجل للمسير.</div>'
            : pagedProd.items.map(mp => {
                const val = Math.max(0, numVal(mp.kg)) * Math.max(0, numVal(mp.unitPrice));
                return `
                  <div class="list-row-card">
                    <div style="min-width:0;">
                      <div style="display:flex;align-items:center;gap:5px;">
                        <span class="grade-pill ${GRADE_INFO[mp.grade].cls}">${escHTML(mp.grade)}</span>
                        <strong style="font-size:12px;color:#0f2942;" dir="ltr">${fmtNum(mp.kg)} كغ</strong>
                        <span style="font-size:10.5px;color:#64748b;" dir="ltr">× ${fmtMoney(mp.unitPrice)}</span>
                      </div>
                      <div style="font-size:9.5px;color:#64748b;" dir="ltr">${escHTML(mp.date)}</div>
                    </div>
                    <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
                      <strong class="text-emerald" style="font-size:12px;" dir="ltr">${fmtMoney(val)}</strong>
                      <button type="button" class="btn btn-xs btn-red" onclick="deleteMgrProduction('${escHTML(mp.id)}')">حذف</button>
                    </div>
                  </div>
                `;
              }).join('');

          subBodyHTML = `
            <form onsubmit="addMgrProduction(event)" class="card stack-xs" style="flex-shrink:0;padding:8px 9px;">
              <div class="flex-between" style="gap:4px;">
                <div class="pill-row" style="flex:1;">
                  ${GRADES.map(g => `<button type="button" class="sel-pill ${mgrSelectedGrade === g ? 'active' : ''}" onclick="onMgrSelectGrade('${g}')">${g}</button>`).join('')}
                </div>
                <div class="pill-row">
                  <button type="button" class="sel-pill ${mgrPriceMode === 'sell' ? 'active' : ''}" onclick="onMgrPriceModeChange('sell')">البيع</button>
                  <button type="button" class="sel-pill ${mgrPriceMode === 'crew' ? 'active' : ''}" onclick="onMgrPriceModeChange('crew')">البحارة</button>
                  <button type="button" class="sel-pill ${mgrPriceMode === 'custom' ? 'active' : ''}" onclick="onMgrPriceModeChange('custom')">مخصص</button>
                </div>
              </div>
              <div class="grid-3" style="align-items:end;">
                <div>
                  <label class="field-label">الكمية (كغ)</label>
                  <input type="number" min="0" step="any" id="mgr-prod-kg" required class="input-field input-compact" placeholder="0" />
                </div>
                <div>
                  <label class="field-label">السعر / كغ</label>
                  <input type="number" min="0" step="any" id="mgr-prod-price" required class="input-field input-compact" value="${defaultPrice}" />
                </div>
                <button type="submit" class="btn btn-emerald" style="height:31px;">+ إضافة</button>
              </div>
            </form>

            <div class="card flex-fill-card">
              <div class="paged-items-wrap">${prodRowsHTML}</div>
              ${renderPagerHTML(pagedProd.page, pagedProd.totalPages, pagedProd.total, 'changeMgrProdPage(-1)', 'changeMgrProdPage(1)')}
            </div>
          `;
        } else {
          const pagedExp = paginateArray(scopedExp, mgrExpPage, 3);
          mgrExpPage = pagedExp.page;

          const expRowsHTML = pagedExp.items.length === 0
            ? '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:11.5px;font-weight:700;">لا توجد مصاريف مسجلة للمسير.</div>'
            : pagedExp.items.map(me => `
                <div class="list-row-card">
                  <div style="min-width:0;">
                    <div style="display:flex;align-items:center;gap:5px;">
                      <strong style="font-size:12px;color:#0f2942;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:155px;">${escHTML(me.item)}</strong>
                      <span class="cat-badge ${getCategoryClass(me.category)}">${escHTML(me.category)}</span>
                    </div>
                    <div style="font-size:9.5px;color:#64748b;" dir="ltr">${escHTML(me.date)}</div>
                  </div>
                  <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
                    <strong class="text-red" style="font-size:12px;" dir="ltr">${fmtMoney(me.amount)}</strong>
                    <button type="button" class="btn btn-xs btn-red" onclick="deleteMgrExpense('${escHTML(me.id)}')">حذف</button>
                  </div>
                </div>
              `).join('');

          subBodyHTML = `
            <form onsubmit="addMgrExpense(event)" class="card stack-xs" style="flex-shrink:0;padding:8px 9px;">
              <div class="pill-row">
                ${MGR_EXPENSE_CATEGORIES.map(c => `<button type="button" class="sel-pill ${mgrExpenseCat === c ? 'active' : ''}" onclick="onMgrSelectExpCat('${c}')">${c}</button>`).join('')}
              </div>
              <div class="grid-3" style="align-items:end;">
                <div>
                  <label class="field-label">البيان</label>
                  <input type="text" id="mgr-exp-item" required class="input-field" placeholder="وصف المصروف" />
                </div>
                <div>
                  <label class="field-label">المبلغ</label>
                  <input type="number" min="0" step="any" id="mgr-exp-amount" required class="input-field input-compact" placeholder="0" />
                </div>
                <button type="submit" class="btn btn-navy" style="height:31px;">+ إضافة</button>
              </div>
            </form>

            <div class="card flex-fill-card">
              <div class="paged-items-wrap">${expRowsHTML}</div>
              ${renderPagerHTML(pagedExp.page, pagedExp.totalPages, pagedExp.total, 'changeMgrExpPage(-1)', 'changeMgrExpPage(1)')}
            </div>
          `;
        }

        return `
          <!-- Top Selection & Summary Strip -->
          <div class="hero-card" style="padding:8px 10px;">
            <div style="display:flex;align-items:center;gap:5px;margin-bottom:6px;">
              <select class="input-field" style="flex:1;background:rgba(255,255,255,0.14);color:#fff;border-color:rgba(56,189,248,0.45);padding:4px 6px;font-size:11px;" onchange="selectBoat(this.value)">
                ${state.boats.map(b => '<option value="' + escHTML(b.id) + '" style="color:#0f172a;" ' + (b.id === boat.id ? 'selected' : '') + '>' + escHTML(b.name) + ' (' + escHTML(b.captain) + ')</option>').join('')}
              </select>
              <input type="date" class="input-field" style="width:118px;background:rgba(255,255,255,0.14);color:#fff;border-color:rgba(56,189,248,0.45);padding:4px 5px;font-size:10.5px;" value="${escHTML(selectedDate)}" onchange="onTodayDateChange(this.value)" />
              <button type="button" class="btn btn-xs ${mgrDateScope === 'all' ? 'btn-cyan' : 'btn-light-alpha'}" onclick="toggleMgrDateScope()">
                ${mgrDateScope === 'all' ? 'كل التواريخ' : 'اليوم فقط'}
              </button>
            </div>
            <div class="grid-3" style="background:rgba(255,255,255,0.1);border-radius:9px;padding:5px 4px;text-align:center;">
              <div>
                <div style="font-size:9.5px;color:#bae6fd;font-weight:700;">إنتاج المسير (<span dir="ltr">${fmtNum(prodKg)}</span> كغ)</div>
                <div style="font-size:13px;font-weight:900;color:#34d399;" dir="ltr">${fmtMoney(prodVal)}</div>
              </div>
              <div style="border-inline:1px solid rgba(255,255,255,0.18);">
                <div style="font-size:9.5px;color:#bae6fd;font-weight:700;">مصروف المسير</div>
                <div style="font-size:13px;font-weight:900;color:#fca5a5;" dir="ltr">${fmtMoney(expTotal)}</div>
              </div>
              <div>
                <div style="font-size:9.5px;color:#bae6fd;font-weight:700;">الصافي</div>
                <div style="font-size:13px;font-weight:900;color:#ffffff;" dir="ltr">${fmtMoney(netMgr)}</div>
              </div>
            </div>
          </div>

          <!-- Direct Sub-Tab Switcher: [ الإنتاج ] | [ المصروف ] -->
          <div class="subtab-bar">
            <button type="button" class="subtab-btn ${mgrSubTab === 'prod' ? 'active' : ''}" onclick="switchMgrSubTab('prod')">الإنتاج</button>
            <button type="button" class="subtab-btn ${mgrSubTab === 'exp' ? 'active' : ''}" onclick="switchMgrSubTab('exp')">المصروف</button>
          </div>

          ${subBodyHTML}
        `;
      }

      function switchMgrSubTab(sub) {
        mgrSubTab = sub;
        renderActiveTab();
      }

      function toggleMgrDateScope() {
        mgrDateScope = mgrDateScope === 'selected' ? 'all' : 'selected';
        mgrProdPage = 1;
        mgrExpPage = 1;
        renderActiveTab();
      }

      function onMgrSelectGrade(grade) {
        mgrSelectedGrade = grade;
        renderActiveTab();
      }

      function onMgrPriceModeChange(mode) {
        mgrPriceMode = mode;
        renderActiveTab();
        if (mode === 'custom') {
          const inp = document.getElementById('mgr-prod-price');
          if (inp) inp.focus();
        }
      }

      function onMgrSelectExpCat(cat) {
        mgrExpenseCat = cat;
        renderActiveTab();
      }

      function changeMgrProdPage(delta) {
        mgrProdPage += delta;
        renderActiveTab();
      }

      function changeMgrExpPage(delta) {
        mgrExpPage += delta;
        renderActiveTab();
      }

      function addMgrProduction(e) {
        e.preventDefault();
        const boat = getActiveBoat();
        const kg = Math.max(0, numVal(document.getElementById('mgr-prod-kg').value));
        const unitPrice = Math.max(0, numVal(document.getElementById('mgr-prod-price').value));
        if (kg <= 0) {
          showToast('الرجاء إدخال كمية أكبر من الصفر', 'error');
          return;
        }
        if (!Array.isArray(boat.managerProduction)) boat.managerProduction = [];
        boat.managerProduction.unshift({
          id: 'mp-' + Date.now(),
          date: boat.todayDate || getTodayISO(),
          grade: mgrSelectedGrade,
          kg: kg,
          unitPrice: unitPrice,
          note: ''
        });
        mgrProdPage = 1;
        persistState(true, 'إضافة إنتاج المسير (' + boat.name + ')');
        renderActiveTab();
        showToast('تم تسجيل إنتاج المسير', 'success');
      }

      function deleteMgrProduction(id) {
        const boat = getActiveBoat();
        boat.managerProduction = (boat.managerProduction || []).filter(x => x.id !== id);
        persistState(true, 'حذف سجل إنتاج للمسير (' + boat.name + ')');
        renderActiveTab();
        showToast('تم حذف سجل الإنتاج', 'info');
      }

      function addMgrExpense(e) {
        e.preventDefault();
        const boat = getActiveBoat();
        const item = document.getElementById('mgr-exp-item').value.trim();
        const amount = Math.max(0, numVal(document.getElementById('mgr-exp-amount').value));
        if (!item || amount <= 0) {
          showToast('الرجاء إدخال البيان والمبلغ', 'error');
          return;
        }
        if (!Array.isArray(boat.managerExpenses)) boat.managerExpenses = [];
        boat.managerExpenses.unshift({
          id: 'me-' + Date.now(),
          date: boat.todayDate || getTodayISO(),
          item: item,
          category: mgrExpenseCat,
          amount: amount
        });
        mgrExpPage = 1;
        persistState(true, 'إضافة مصروف المسير (' + boat.name + '): ' + item);
        renderActiveTab();
        showToast('تم تسجيل مصروف المسير', 'success');
      }

      function deleteMgrExpense(id) {
        const boat = getActiveBoat();
        boat.managerExpenses = (boat.managerExpenses || []).filter(x => x.id !== id);
        persistState(true, 'حذف مصروف للمسير (' + boat.name + ')');
        renderActiveTab();
        showToast('تم حذف المصروف', 'info');
      }

      /* ========================================================================
         12. TAB 6: PRICING (الأسعار — 4 COMPACT CARDS, NO EXTRA TABLES)
         ======================================================================== */
      function renderPricingTab() {
        const boat = getActiveBoat();

        const cardsHTML = GRADES.map(g => {
          const info = GRADE_INFO[g];
          const sell = boat.pricing[g].sellPrice;
          const crew = boat.pricing[g].crewPrice;
          const diff = sell - crew;
          return `
            <div class="card flex-between" style="padding:7px 10px;gap:8px;">
              <div style="min-width:95px;">
                <span class="grade-pill ${info.cls}">${info.label} — ${info.desc}</span>
                <div style="font-size:10px;font-weight:800;margin-top:4px;color:${diff >= 0 ? '#059669' : '#dc2626'};" id="price-diff-${g}">
                  الفارق: <span dir="ltr">${fmtMoney(diff)}</span>
                </div>
              </div>

              <div style="flex:1;max-width:120px;">
                <label class="field-label" style="margin-bottom:2px;">سعر البيع الفعلي</label>
                <input type="number" min="0" step="any"
                  class="input-field input-compact text-navy"
                  value="${sell}"
                  oninput="onSellPriceInput('${g}', this.value)" />
              </div>

              <div style="background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:5px 8px;text-align:center;min-width:92px;">
                <div style="font-size:9px;font-weight:800;color:#92400e;">سعر البحارة</div>
                <div style="font-size:13px;font-weight:900;color:#b45309;" dir="ltr">${fmtMoney(crew)}</div>
              </div>
            </div>
          `;
        }).join('');

        return `
          <!-- Top Bar: Currency + Apply Sell Price to All -->
          <div class="card flex-between" style="flex-shrink:0;padding:7px 9px;">
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-size:11px;font-weight:800;color:#0f2942;">العملة:</span>
              <input type="text" class="input-field" style="width:76px;padding:4px 6px;text-align:center;font-size:11.5px;" value="${escHTML(state.currency)}" oninput="onCurrencyChange(this.value)" />
            </div>
            <button type="button" class="btn btn-xs btn-navy" onclick="applySellPricesToAll()">تعميم سعر البيع على الكل</button>
          </div>

          <!-- 4 Compact Grade Cards -->
          <div class="pricing-grid-4">
            ${cardsHTML}
          </div>
        `;
      }

      function onCurrencyChange(val) {
        state.currency = val.trim() || 'أوقية';
        persistState(true, 'تغيير العملة إلى ' + state.currency);
      }

      function onSellPriceInput(grade, rawVal) {
        const boat = getActiveBoat();
        const sell = Math.max(0, numVal(rawVal));
        boat.pricing[grade].sellPrice = sell;
        persistState(true, 'تعديل سعر بيع ' + grade + ' لسفينة ' + boat.name);

        const diff = sell - boat.pricing[grade].crewPrice;
        const diffEl = document.getElementById('price-diff-' + grade);
        if (diffEl) {
          diffEl.style.color = diff >= 0 ? '#059669' : '#dc2626';
          diffEl.innerHTML = 'الفارق: <span dir="ltr">' + fmtMoney(diff) + '</span>';
        }
      }

      function applySellPricesToAll() {
        const src = getActiveBoat();
        state.boats.forEach(b => {
          if (b.id !== src.id) {
            GRADES.forEach(g => { b.pricing[g].sellPrice = src.pricing[g].sellPrice; });
          }
        });
        persistState(true, 'تعميم سعر البيع على كافة السفن');
        showToast('تم تعميم سعر البيع الفعلي على كافة السفن', 'success');
      }

      /* ========================================================================
         13. TAB 7: FLEET / BOATS (السفن — PAGINATED CARDS + TABBED MODAL)
         ======================================================================== */
      function renderBoatsTab() {
        const activeId = state.activeBoatId;
        const paged = paginateArray(state.boats, boatsPage, 3);
        boatsPage = paged.page;

        const cardsHTML = paged.items.map(b => {
          const m = calcBoatMetrics(b);
          const isActive = b.id === activeId;
          return `
            <div class="card" style="padding:8px 10px;${isActive ? 'border:2px solid #0ea5e9;background:#f0f9ff;' : ''}">
              <div class="flex-between" style="cursor:pointer;" onclick="openShipModal('${escHTML(b.id)}')">
                <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                  <div style="width:36px;height:36px;border-radius:10px;background:#ffffff;border:1px solid #cbd5e1;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                    <svg width="22" height="22" viewBox="0 0 32 32" fill="none">
                      <rect x="13" y="5" width="6" height="4" rx="1" fill="#0f2942"/>
                      <path d="M8 9H24L25.5 17H6.5L8 9Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
                      <path d="M4 17H28L25 24.5H7L4 17Z" fill="#ef4444"/>
                      <path d="M3 26C6 24.5 9 27.5 12 26C15 24.5 18 27.5 21 26C24 24.5 27 27.5 29 26" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                  </div>
                  <div style="min-width:0;">
                    <div style="display:flex;align-items:center;gap:5px;">
                      <strong style="font-size:13.5px;color:#0f2942;">${escHTML(b.name)}</strong>
                      ${isActive ? '<span class="cat-badge cat-ice">نشطة</span>' : ''}
                    </div>
                    <div style="font-size:10px;color:#64748b;">الربان: ${escHTML(b.captain)} • 6 بحارة</div>
                  </div>
                </div>
                <div style="text-align:left;flex-shrink:0;">
                  <div style="font-size:9.5px;color:#64748b;">الصافي</div>
                  <div class="${m.netVesselProfit >= 0 ? 'text-emerald' : 'text-red'}" style="font-size:13px;font-weight:900;" dir="ltr">${fmtMoney(m.netVesselProfit)}</div>
                </div>
              </div>

              <div class="grid-3" style="margin-top:6px;background:#ffffff;border:1px solid #e2e8f0;border-radius:8px;padding:4px 6px;text-align:center;font-size:10px;">
                <div><span class="text-muted">إنتاج:</span> <strong dir="ltr">${fmtNum(m.totalProductionKg)} كغ</strong></div>
                <div><span class="text-muted">بيع:</span> <strong dir="ltr">${fmtMoney(m.totalSalesValue)}</strong></div>
                <div><span class="text-muted">ديون:</span> <strong class="text-red" dir="ltr">${fmtMoney(m.totalDebt)}</strong></div>
              </div>

              <div class="grid-2" style="margin-top:6px;">
                <button type="button" class="btn btn-xs ${isActive ? 'btn-navy' : 'btn-ghost'}" onclick="selectBoat('${escHTML(b.id)}')">
                  ${isActive ? 'السفينة النشطة' : 'تفعيل السفينة'}
                </button>
                <button type="button" class="btn btn-xs btn-cyan" onclick="openShipModal('${escHTML(b.id)}')">تعديل السفينة والأسعار</button>
              </div>
            </div>
          `;
        }).join('');

        return `
          <!-- Top Bar -->
          <div class="flex-between" style="flex-shrink:0;">
            <div>
              <div class="sec-title">أسطول السفن (${state.boats.length})</div>
              <div class="sec-subtitle">اضغط على أي سفينة لتعديل طاقمها وأسعار بحارتها</div>
            </div>
            <div style="display:flex;gap:5px;">
              <button type="button" class="btn btn-xs btn-ghost" onclick="openHistoryModal()">سجل الأيام (${state.history.length})</button>
              <button type="button" class="btn btn-xs btn-navy" onclick="openShipModal(null)">+ سفينة جديدة</button>
            </div>
          </div>

          <!-- Paginated Fleet Cards -->
          <div class="card flex-fill-card" style="background:transparent;border:none;box-shadow:none;padding:0;">
            <div class="paged-items-wrap">${cardsHTML}</div>
            ${paged.totalPages > 1 ? '<div class="card" style="padding:4px 8px;margin-top:4px;">' + renderPagerHTML(paged.page, paged.totalPages, paged.total, 'changeBoatsPage(-1)', 'changeBoatsPage(1)') + '</div>' : ''}
          </div>
        `;
      }

      function changeBoatsPage(delta) {
        boatsPage += delta;
        renderActiveTab();
      }

      function switchShipModalSubTab(sub) {
        const infoBtn = document.getElementById('ship-st-btn-info');
        const priceBtn = document.getElementById('ship-st-btn-prices');
        const infoDiv = document.getElementById('ship-st-info');
        const priceDiv = document.getElementById('ship-st-prices');

        infoBtn.classList.toggle('active', sub === 'info');
        priceBtn.classList.toggle('active', sub === 'prices');
        infoDiv.style.display = sub === 'info' ? 'block' : 'none';
        priceDiv.style.display = sub === 'prices' ? 'block' : 'none';
      }

      function openShipModal(boatId) {
        updateCurrencyLabels();
        switchShipModalSubTab('info');
        const isEdit = Boolean(boatId);
        const boat = isEdit ? state.boats.find(b => b.id === boatId) : null;
        const sailorInputs = document.querySelectorAll('.ship-sailor-name');
        const delWrap = document.getElementById('ship-form-delete-wrap');

        if (isEdit && boat) {
          document.getElementById('ship-form-title').textContent = 'تعديل السفينة — ' + boat.name;
          document.getElementById('ship-form-id').value = boat.id;
          document.getElementById('ship-form-name').value = boat.name;
          document.getElementById('ship-form-captain').value = boat.captain;

          sailorInputs.forEach((inp, i) => {
            inp.value = (boat.sailors[i] && boat.sailors[i].name) || ('بحار ' + (i + 1));
          });
          GRADES.forEach(g => {
            document.getElementById('ship-form-crew-' + g).value = boat.pricing[g].crewPrice;
          });
          delWrap.style.display = state.boats.length > 1 ? 'block' : 'none';
        } else {
          const refPricing = getActiveBoat().pricing;
          document.getElementById('ship-form-title').textContent = 'إضافة سفينة جديدة';
          document.getElementById('ship-form-id').value = '';
          document.getElementById('ship-form-name').value = '';
          document.getElementById('ship-form-captain').value = '';

          sailorInputs.forEach((inp, i) => {
            inp.value = 'بحار ' + (i + 1);
          });
          GRADES.forEach(g => {
            document.getElementById('ship-form-crew-' + g).value = refPricing[g].crewPrice;
          });
          delWrap.style.display = 'none';
        }

        openModal('modal-ship-form');
      }

      function submitShipForm(e) {
        e.preventDefault();
        const id = document.getElementById('ship-form-id').value.trim();
        const name = document.getElementById('ship-form-name').value.trim();
        const captain = document.getElementById('ship-form-captain').value.trim();
        const sailorInputs = Array.from(document.querySelectorAll('.ship-sailor-name'));
        const names = sailorInputs.map((inp, i) => inp.value.trim() || ('بحار ' + (i + 1)));

        const crewPrices = {};
        GRADES.forEach(g => {
          crewPrices[g] = Math.max(0, numVal(document.getElementById('ship-form-crew-' + g).value));
        });

        if (!name || !captain) {
          switchShipModalSubTab('info');
          showToast('الرجاء إدخال اسم السفينة والربان', 'error');
          return;
        }

        if (id) {
          const boat = state.boats.find(b => b.id === id);
          if (!boat) return;
          boat.name = name;
          boat.captain = captain;
          boat.sailors.forEach((s, i) => { s.name = names[i]; });
          GRADES.forEach(g => { boat.pricing[g].crewPrice = crewPrices[g]; });

          persistState(true, 'تحديث بيانات وأسعار سفينة ' + name);
          showToast('تم حفظ بيانات السفينة وأسعار البحارة', 'success');
        } else {
          const refPricing = getActiveBoat().pricing;
          const newPricing = {};
          GRADES.forEach(g => {
            newPricing[g] = { sellPrice: refPricing[g].sellPrice, crewPrice: crewPrices[g] };
          });

          const newBoat = {
            id: 'ship-' + Date.now(),
            name: name,
            captain: captain,
            todayDate: getTodayISO(),
            pricing: newPricing,
            boatProduction: createEmptyProduction(),
            sailors: names.map((nm, i) => ({
              id: i + 1,
              name: nm,
              production: createEmptyProduction(),
              debt: 0,
              autoDeduct: true,
              manualDeduction: 0
            })),
            purchases: [],
            managerProduction: [],
            managerExpenses: []
          };

          state.boats.push(newBoat);
          state.activeBoatId = newBoat.id;
          boatsPage = Math.ceil(state.boats.length / 3);
          persistState(true, 'إضافة سفينة جديدة: ' + name);
          showToast('تمت إضافة السفينة بنجاح', 'success');
        }

        closeModal('modal-ship-form');
        renderHeaderShipSelect();
        renderActiveTab();
      }

      function confirmDeleteEditingShip() {
        const id = document.getElementById('ship-form-id').value.trim();
        const boat = state.boats.find(b => b.id === id);
        if (!boat || state.boats.length <= 1) return;

        openConfirmModal({
          title: 'حذف السفينة',
          message: 'هل أنت متأكد من حذف سفينة "' + boat.name + '" نهائياً من الأسطول؟',
          btnClass: 'btn-red',
          okLabel: 'حذف السفينة',
          onConfirm: function () {
            state.boats = state.boats.filter(b => b.id !== id);
            if (state.activeBoatId === id) state.activeBoatId = state.boats[0].id;
            persistState(true, 'حذف سفينة: ' + boat.name);
            closeModal('modal-ship-form');
            renderHeaderShipSelect();
            renderActiveTab();
            showToast('تم حذف السفينة', 'info');
          }
        });
      }

      /* ========================================================================
         14. SETTLEMENT PREVIEW (3 SUB-TABS + PRINT SHEET) & HISTORY ARCHIVE
         ======================================================================== */
      function onTodayDateChange(val) {
        const boat = getActiveBoat();
        boat.todayDate = val || getTodayISO();
        mgrProdPage = 1;
        mgrExpPage = 1;
        persistState(true, 'تغيير تاريخ اليومية إلى ' + boat.todayDate);
        renderActiveTab();
      }

      function promptSaveDayToHistory() {
        const boat = getActiveBoat();
        const m = calcBoatMetrics(boat);
        openConfirmModal({
          title: 'حفظ التصفية في سجل الأيام',
          message: 'حفظ يومية "' + boat.name + '" بتاريخ ' + boat.todayDate + ' (صافي الربح: ' + fmtMoney(m.netVesselProfit) + ' ' + state.currency + ')؟',
          check1Label: 'خصم الديون المستقطعة (' + fmtMoney(m.totalDebtDeducted) + ' ' + state.currency + ') من رصيد البحارة',
          check1Default: true,
          check2Label: 'تصفير خانات إنتاج اليوم والمشتريات للبدء بيوم جديد',
          check2Default: false,
          btnClass: 'btn-navy',
          okLabel: 'حفظ في السجل',
          onConfirm: function (checks) {
            const snapshot = {
              id: 'hist-' + Date.now(),
              boatId: boat.id,
              boatName: boat.name,
              captain: boat.captain,
              date: boat.todayDate,
              savedAt: getTimeStampLabel(),
              totalKg: m.totalProductionKg,
              vesselKg: m.vesselProdKg,
              vesselSalesVal: m.vesselSalesVal,
              sailorsKg: m.sailorsProdKg,
              sailorsSalesVal: m.sailorsSalesVal,
              totalSales: m.totalSalesValue,
              totalSailorsShare: m.totalSailorsShare,
              totalDebtDeducted: m.totalDebtDeducted,
              totalNetPaid: m.totalNetPaidToSailors,
              totalPurchases: m.totalPurchases,
              netProfit: m.netVesselProfit,
              sailors: m.sailorMetrics.map(sm => ({
                name: sm.name,
                kg: sm.kg,
                grossShare: sm.grossShare,
                deduction: sm.deduction,
                netPayable: sm.netPayable,
                debtAfter: checks.check1 ? sm.remainingDebt : sm.debt
              })),
              purchases: boat.purchases.map(p => ({ item: p.item, category: p.category, amount: p.amount, date: p.date }))
            };

            state.history.unshift(snapshot);
            if (checks.check1) {
              boat.sailors.forEach((s, idx) => {
                s.debt = m.sailorMetrics[idx].remainingDebt;
                s.manualDeduction = 0;
              });
            }
            if (checks.check2) {
              boat.boatProduction = createEmptyProduction();
              boat.sailors.forEach(s => { s.production = createEmptyProduction(); });
              boat.purchases = [];
            }

            persistState(true, 'حفظ تصفية يوم ' + snapshot.date + ' (' + boat.name + ')');
            renderActiveTab();
            showToast('تم حفظ اليومية في سجل الأيام بنجاح', 'success');
          }
        });
      }

      function openHistoryModal() {
        historyPage = 1;
        renderHistoryModalBody();
        openModal('modal-history');
      }

      function renderHistoryModalBody() {
        const body = document.getElementById('history-modal-body');
        if (!body) return;
        const paged = paginateArray(state.history, historyPage, 4);
        historyPage = paged.page;

        const itemsHTML = paged.items.length === 0
          ? '<div style="flex:1;display:flex;align-items:center;justify-content:center;color:#64748b;font-weight:700;">لا توجد تصفيات محفوظة في سجل الأيام بعد.</div>'
          : paged.items.map(rec => `
              <div class="list-row-card">
                <div style="min-width:0;">
                  <strong style="font-size:12.5px;color:#0f2942;">${escHTML(rec.boatName)}</strong>
                  <div style="font-size:10px;color:#64748b;" dir="ltr">${escHTML(rec.date)} • ${fmtNum(rec.totalKg)} كغ</div>
                </div>
                <div style="display:flex;align-items:center;gap:5px;flex-shrink:0;">
                  <strong class="${rec.netProfit >= 0 ? 'text-emerald' : 'text-red'}" style="font-size:12px;" dir="ltr">${fmtMoney(rec.netProfit)}</strong>
                  <button type="button" class="btn btn-xs btn-cyan" onclick="viewHistoryRecord('${escHTML(rec.id)}')">عرض</button>
                  <button type="button" class="btn btn-xs btn-red" onclick="deleteHistoryRecord('${escHTML(rec.id)}')">حذف</button>
                </div>
              </div>
            `).join('');

        body.innerHTML = `
          <div class="paged-items-wrap">${itemsHTML}</div>
          ${renderPagerHTML(paged.page, paged.totalPages, paged.total, 'changeHistoryPage(-1)', 'changeHistoryPage(1)')}
        `;
      }

      function changeHistoryPage(delta) {
        historyPage += delta;
        renderHistoryModalBody();
      }

      function getCurrentSettlementSnapshot() {
        const boat = getActiveBoat();
        const m = calcBoatMetrics(boat);
        return {
          boatName: boat.name,
          captain: boat.captain,
          date: boat.todayDate,
          vesselKg: m.vesselProdKg,
          sailorsKg: m.sailorsProdKg,
          totalKg: m.totalProductionKg,
          totalSales: m.totalSalesValue,
          totalSailorsShare: m.totalSailorsShare,
          totalDebtDeducted: m.totalDebtDeducted,
          totalNetPaid: m.totalNetPaidToSailors,
          totalPurchases: m.totalPurchases,
          netProfit: m.netVesselProfit,
          sailors: m.sailorMetrics.map(sm => ({
            name: sm.name,
            kg: sm.kg,
            grossShare: sm.grossShare,
            deduction: sm.deduction,
            netPayable: sm.netPayable
          })),
          purchases: boat.purchases
        };
      }

      function buildWhatsAppText(rec) {
        const lines = [
          '*كشف تصفية سفينة: ' + rec.boatName + '*',
          'الربان: ' + rec.captain,
          'التاريخ: ' + rec.date,
          '-----------------',
          'إجمالي الإنتاج: ' + fmtNum(rec.totalKg) + ' كغ',
          'إجمالي المبيعات: ' + fmtMoney(rec.totalSales) + ' ' + state.currency,
          'حصة البحارة: ' + fmtMoney(rec.totalSailorsShare) + ' ' + state.currency,
          'الديون المخصومة: ' + fmtMoney(rec.totalDebtDeducted) + ' ' + state.currency,
          'الصافي المدفوع للبحارة: ' + fmtMoney(rec.totalNetPaid) + ' ' + state.currency,
          'المشتريات والمصاريف: ' + fmtMoney(rec.totalPurchases) + ' ' + state.currency,
          '*صافي ربح السفينة: ' + fmtMoney(rec.netProfit) + ' ' + state.currency + '*',
          '-----------------',
          '*تفاصيل البحارة:*'
        ];
        rec.sailors.forEach((s, i) => {
          lines.push((i + 1) + '. ' + s.name + ': ' + fmtNum(s.kg) + ' كغ | حصة: ' + fmtMoney(s.grossShare) + ' | خصم: ' + fmtMoney(s.deduction) + ' | صافي: ' + fmtMoney(s.netPayable));
        });
        return lines.join('\n');
      }

      function buildFullPrintHTML(rec) {
        const sailorsRows = rec.sailors.map((s, i) => `
          <tr>
            <td>${i + 1}. ${escHTML(s.name)}</td>
            <td dir="ltr">${fmtNum(s.kg)}</td>
            <td dir="ltr">${fmtMoney(s.grossShare)}</td>
            <td dir="ltr">${fmtMoney(s.deduction)}</td>
            <td dir="ltr"><strong>${fmtMoney(s.netPayable)}</strong></td>
          </tr>
        `).join('');

        const purRows = rec.purchases.length === 0
          ? '<tr><td colspan="3" style="text-align:center;">لا توجد مشتريات</td></tr>'
          : rec.purchases.map(p => `
              <tr><td>${escHTML(p.item)}</td><td>${escHTML(p.category)}</td><td dir="ltr">${fmtMoney(p.amount)}</td></tr>
            `).join('');

      function copyTextSafely(text) {
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand('copy');
          document.body.removeChild(ta);
          if (ok) return true;
        } catch (e) { /* fallback */ }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).catch(() => {});
          return true;
        }
        return false;
      }

      function copyReportSummary() {

      /* ========================================================================
         15. OFFLINE & AUTOMATIC CLOUD SYNC ENGINE (TABBED MODAL)
         ======================================================================== */
      function updateHeaderSyncBadge() {
        const btn = document.getElementById('hdr-sync-btn');
        const txt = document.getElementById('hdr-sync-text');
        if (!btn || !txt) return;

        const online = navigator.onLine;
        const pending = state.sync.pendingChangesCount || 0;
        const hasUrl = Boolean((state.sync.syncUrl || '').trim());

        btn.classList.remove('badge-green', 'badge-amber', 'badge-gray');

        if (isSyncing) {
          btn.classList.add('badge-amber');
          txt.textContent = 'مزامنة...';
          return;
        }
        if (!online) {
          btn.classList.add('badge-gray');
          txt.textContent = pending > 0 ? ('أوفلاين (' + pending + ')') : 'أوفلاين';
          return;
        }
        if (hasUrl && pending > 0) {
          btn.classList.add('badge-amber');
          txt.textContent = 'انتظار (' + pending + ')';
        } else {
          btn.classList.add('badge-green');
          txt.textContent = hasUrl ? 'متزامن' : 'حفظ محلي';
        }
      }

      function scheduleAutoSync() {
        if (!state.sync || !state.sync.autoSync) return;
        if (!navigator.onLine) return;
        if (!(state.sync.syncUrl || '').trim()) return;

        if (autoSyncTimer) clearTimeout(autoSyncTimer);
        autoSyncTimer = setTimeout(() => {
          triggerAutoSyncIfReady();
        }, 1500);
      }

      function triggerAutoSyncIfReady() {
        if (isSyncing) return;
        if (!navigator.onLine) return;
        if (!state.sync || !state.sync.autoSync) return;
        if (!(state.sync.syncUrl || '').trim()) return;
        if ((state.sync.pendingChangesCount || 0) <= 0) return;
        performCloudSync(true);
      }

      async function performCloudSync(isSilent) {
        const url = (state.sync.syncUrl || '').trim();
        if (!url) {
          if (!isSilent) showToast('أدخل رابط المزامنة السحابية أو استخدم النسخ الاحتياطي', 'info');
          return;
        }
        if (!navigator.onLine) {
          if (!isSilent) showToast('الجهاز غير متصل بالإنترنت — البيانات محفوظة محلياً', 'info');
          updateHeaderSyncBadge();
          return;
        }
        if (isSyncing) return;

        isSyncing = true;
        updateHeaderSyncBadge();

        try {
          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              app: 'fishing-fleet-manager',
              syncedAt: new Date().toISOString(),
              data: state
            })
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);

          state.sync.pendingChangesCount = 0;
          state.sync.lastSyncedAt = getTimeStampLabel();
          pushSyncLog(isSilent ? 'مزامنة تلقائية سحابية ناجحة' : 'مزامنة يدوية سحابية ناجحة');
          saveToLocalStorage();
          if (!isSilent) showToast('تمت المزامنة السحابية بنجاح', 'success');
        } catch (err) {
          pushSyncLog('تعذر الوصول للخادم: حفظ محلي آمن');
          saveToLocalStorage();
          if (!isSilent) showToast('تعذر الاتصال بالخادم — البيانات محفوظة محلياً', 'error');
        } finally {
          isSyncing = false;
          updateHeaderSyncBadge();
          if (document.getElementById('modal-sync').classList.contains('open')) {
            renderSyncModalBody();
          }
        }
      }

      function openSyncModal() {
        syncModalSubTab = 'cloud';
        renderSyncModalBody();
        openModal('modal-sync');
      }

      function switchSyncSubTab(sub) {
        syncModalSubTab = sub;

      }

      function renderSyncModalBody() {
        const body = document.getElementById('sync-modal-body');
        if (!body) return;
        const online = navigator.onLine;
        const pending = state.sync.pendingChangesCount || 0;

        const statusBanner = `
          <div class="card" style="background:${online ? '#d1fae5' : '#f1f5f9'};border-color:${online ? '#a7f3d0' : '#cbd5e1'};padding:8px 10px;">

              <span class="cat-badge ${pending > 0 ? 'cat-food' : 'cat-pers'}">${pending > 0 ? (pending + ' تغييرات بالانتظار') : 'محفوظ بالكامل'}</span>
            </div>
            <div style="font-size:10px;color:#475569;margin-top:2px;">آخر مزامنة: <span dir="ltr">${escHTML(state.sync.lastSyncedAt || 'محلي')}</span></div>
          </div>
        `;

        const subTabBar = `
          <div class="subtab-bar">

          </div>
        `;

        let innerHTML = '';
        if (syncModalSubTab === 'cloud') {
          const logsHTML = (state.sync.logs || []).slice(0, 4).map(l =>
            '<div style="font-size:10.5px;padding:3px 0;border-bottom:1px solid #f1f5f9;" class="flex-between"><span>' + escHTML(l.msg) + '</span><span style="color:#94a3b8;" dir="ltr">' + escHTML(l.time) + '</span></div>'
          ).join('');

          innerHTML = `
            <div class="stack-sm">
              <div>
                <label class="field-label">رابط Webhook / API للمزامنة التلقائية (اختياري)</label>
                <input type="url" class="input-field" dir="ltr" value="${escHTML(state.sync.syncUrl || '')}" placeholder="https://example.com/api/fleet-sync" oninput="onSyncUrlInput(this.value)" />

              <label class="toggle-pill">
                <input type="checkbox" ${state.sync.autoSync ? 'checked' : ''} onchange="onAutoSyncToggle(this.checked)" />
                <span>تفعيل المزامنة التلقائية عند الاتصال بالإنترنت</span>
              </label>
              <button type="button" class="btn btn-cyan btn-block" onclick="performCloudSync(false)">مزامنة سحابية الآن</button>
              <div class="card" style="background:#f8fafc;padding:7px 9px;">
                <div style="font-size:11px;font-weight:900;color:#0f2942;margin-bottom:3px;">آخر العمليات</div>
                ${logsHTML || '<div style="font-size:10.5px;color:#64748b;">لا توجد عمليات.</div>'}
              </div>
            </div>
          `;
        } else {
          innerHTML = `
            <div class="stack-sm">
              <div class="grid-2">
                <button type="button" class="btn btn-navy" onclick="exportBackupJSON()">تصدير ملف JSON</button>
                <label class="btn btn-ghost" style="cursor:pointer;">
                  استيراد ملف JSON
                  <input type="file" accept=".json,application/json" style="display:none;" onchange="importBackupJSON(event)" />
                </label>
              </div>
              <div class="card stack-xs" style="background:#f8fafc;padding:8px;">
                <div class="flex-between">
                  <span style="font-size:11px;font-weight:800;color:#0f2942;">النقل السريع عبر كود المزامنة</span>
                  <button type="button" class="btn btn-xs btn-emerald" onclick="copySyncCode()">نسخ الكود</button>
                </div>
                <textarea id="paste-sync-code-area" rows="3" class="input-field" dir="ltr" placeholder="الصق كود المزامنة من جهاز آخر هنا ثم اضغط استعادة..."></textarea>
                <button type="button" class="btn btn-sm btn-amber btn-block" onclick="applyPastedSyncCode()">استعادة البيانات من الكود</button>
              </div>
            </div>
          `;
        }

        body.innerHTML = `
          ${statusBanner}
          ${subTabBar}
          <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;">
            ${innerHTML}
          </div>
        `;
      }

      function onSyncUrlInput(val) {
        state.sync.syncUrl = val.trim();
        saveToLocalStorage();
        updateHeaderSyncBadge();
      }

      function onAutoSyncToggle(checked) {
        state.sync.autoSync = Boolean(checked);
        saveToLocalStorage();
        if (checked) triggerAutoSyncIfReady();
        showToast(checked ? 'تم تفعيل المزامنة التلقائية' : 'تم إيقاف المزامنة التلقائية', 'info');
      }

      function exportBackupJSON() {
        try {
          const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'fleet-backup-' + getTodayISO() + '.json';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          pushSyncLog('تصدير نسخة احتياطية JSON');
          saveToLocalStorage();
          showToast('تم تحميل ملف النسخة الاحتياطية', 'success');
        } catch (e) {
          showToast('تعذر تصدير الملف', 'error');
        }
      }

      function importBackupJSON(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function (ev) {
          try {
            const parsed = JSON.parse(ev.target.result);
            state = normalizeState(parsed);
            state.sync.pendingChangesCount = 0;
            state.sync.lastSyncedAt = getTimeStampLabel();
            pushSyncLog('استيراد بيانات من ملف JSON');
            saveToLocalStorage();
            renderHeaderShipSelect();
            renderActiveTab();
            renderSyncModalBody();
            updateHeaderSyncBadge();
            showToast('تم استيراد البيانات بنجاح', 'success');
          } catch (err) {
            showToast('ملف JSON غير صالح', 'error');
          }
        };
        reader.readAsText(file);
      }

      function copySyncCode() {
        const jsonStr = JSON.stringify(state);
        const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
        copyTextSafely(encoded);
        pushSyncLog('نسخ كود المزامنة');
        saveToLocalStorage();
        showToast('تم نسخ كود المزامنة', 'success');
      }

      function applyPastedSyncCode() {
        const area = document.getElementById('paste-sync-code-area');
        const code = (area && area.value || '').trim();
        if (!code) {
          showToast('الرجاء لصق كود المزامنة أولاً', 'error');
          return;
        }
        try {
          const decoded = decodeURIComponent(escape(atob(code)));
          const parsed = JSON.parse(decoded);
          state = normalizeState(parsed);
          state.sync.pendingChangesCount = 0;
          state.sync.lastSyncedAt = getTimeStampLabel();
          pushSyncLog('استعادة البيانات عبر كود المزامنة');
          saveToLocalStorage();
          renderHeaderShipSelect();
          renderActiveTab();
          renderSyncModalBody();
          updateHeaderSyncBadge();
          showToast('تمت استعادة البيانات بنجاح', 'success');
        } catch (e) {
          showToast('كود المزامنة غير صالح', 'error');
        }
      }
